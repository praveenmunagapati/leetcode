<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRUCTLAB — Algorithm Visualizer & Data Structure Lab</title>
<meta name="description" content="Interactive algorithm visualizer and data structure laboratory with step-by-step execution tracing, pseudocode highlighting, and 50+ structures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- D3.js for data-driven SVG transitions -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<!-- GSAP for purposeful UI animations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<!-- Prism.js for syntax highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<style>
/* ================================================================
   STRUCTLAB — Rich Dark Theme  
   Deep backgrounds · Vibrant nodes · Strong visual hierarchy
================================================================ */
:root {
  --bg:          #080b10;
  --surface-0:   #0d1117;
  --surface-1:   #111820;
  --surface-2:   #161e2a;
  --surface-3:   #1d2736;
  --surface-4:   #243042;
  --border:      rgba(255,255,255,0.07);
  --border-h:    rgba(255,255,255,0.13);
  --border-glow: rgba(99,179,237,0.3);

  --text:        #e2e8f0;
  --text-2:      #94a3b8;
  --text-3:      #546e8a;

  --accent:      #63b3ed;
  --accent-2:    #4299e1;
  --accent-glow: rgba(99,179,237,0.2);
  --accent-dim:  rgba(99,179,237,0.1);

  --green:       #48bb78;
  --green-dim:   rgba(72,187,120,0.12);
  --red:         #fc8181;
  --red-dim:     rgba(252,129,129,0.12);
  --amber:       #f6ad55;
  --amber-dim:   rgba(246,173,85,0.12);
  --purple:      #b794f4;
  --purple-dim:  rgba(183,148,244,0.12);
  --teal:        #4fd1c5;
  --pink:        #f687b3;

  --t-fast: 140ms cubic-bezier(0.4,0,0.2,1);
  --t-med:  240ms cubic-bezier(0.4,0,0.2,1);
  --t-slow: 360ms cubic-bezier(0.4,0,0.2,1);

  --shadow-panel: 0 4px 24px rgba(0,0,0,0.5);
  --shadow-card:  0 2px 12px rgba(0,0,0,0.4);
  --shadow-glow:  0 0 20px rgba(99,179,237,0.15);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── SCROLLBARS ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ── HEADER ─────────────────────────────────────────────────── */
#top {
  height: 54px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  background: linear-gradient(180deg, var(--surface-1) 0%, rgba(13,17,23,0.98) 100%);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04), var(--shadow-panel);
  position: relative;
  z-index: 30;
  flex-shrink: 0;
}
.brand { display:flex;align-items:center;gap:10px;cursor:default;flex-shrink:0; }
.brand-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #1a3a5c 0%, #0d2337 100%);
  border: 1px solid rgba(99,179,237,0.4);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  box-shadow: 0 0 12px rgba(99,179,237,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
}
.brand-meta h1 {
  font: 800 15px/1 'Inter', sans-serif;
  letter-spacing: 0.08em;
  background: linear-gradient(135deg, #e2e8f0 30%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  display:flex;align-items:center;
}
.brand-meta h1 .hi { color: var(--accent); margin-left:1px; }
.brand-meta .sub {
  color: var(--text-3);
  font: 400 9.5px/1.2 'JetBrains Mono', monospace;
  margin-top: 3px;
  letter-spacing: 0.02em;
}

.cat-pill-bar {
  display:flex;gap:4px;overflow-x:auto;padding:2px 4px;
  margin:0 auto 0 6px;max-width:620px;scrollbar-width:none;
}
.cat-pill-bar::-webkit-scrollbar{display:none}
.cpill {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  color: var(--text-3);
  font: 500 10.5px 'Inter', sans-serif;
  padding: 3px 10px; border-radius: 100px; cursor:pointer;
  white-space:nowrap;
  transition: all var(--t-fast);
  display:flex;align-items:center;gap:4px;
}
.cpill:hover { background:var(--surface-3); color:var(--text); border-color:var(--border-h); }
.cpill.active {
  background: linear-gradient(135deg, rgba(99,179,237,0.18) 0%, rgba(66,153,225,0.1) 100%);
  color: var(--accent);
  border-color: rgba(99,179,237,0.45);
  box-shadow: 0 0 8px rgba(99,179,237,0.15);
}

.top-meta { margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0; }
.top-pill-btn {
  background: var(--surface-3);
  border: 1px solid var(--border-h);
  color: var(--text-2);
  padding: 5px 12px; border-radius: 7px;
  font: 500 11.5px 'Inter', sans-serif;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition: all var(--t-fast);
}
.top-pill-btn:hover {
  background: var(--accent-dim);
  border-color: rgba(99,179,237,0.4);
  color: var(--accent);
  box-shadow: var(--shadow-glow);
}
.counter-badge {
  background: var(--green-dim);
  border: 1px solid rgba(72,187,120,0.22);
  color: var(--green);
  font: 600 10.5px 'JetBrains Mono', monospace;
  padding: 3px 10px; border-radius:100px;
  display:flex;align-items:center;gap:6px;
}
.pulse-indicator { width:6px;height:6px;border-radius:50%;background:var(--green); }

/* ── LAYOUT ─────────────────────────────────────────────────── */
#cols {
  display: grid;
  grid-template-columns: 272px 1fr 360px;
  height: calc(100vh - 54px);
  overflow: hidden;
}

/* ── LEFT SIDEBAR ────────────────────────────────────────────── */
#side {
  background: var(--surface-0);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display:flex;flex-direction:column;
}
.search-box-wrap {
  padding: 11px 12px;
  background: var(--surface-0);
  position:sticky;top:0;z-index:10;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.search-inner { position:relative;display:flex;align-items:center; }
.search-icon { position:absolute;left:9px;color:var(--text-3);pointer-events:none; }
#search {
  width:100%;
  padding: 7px 30px 7px 30px;
  background: var(--surface-2);
  border: 1px solid var(--border-h);
  border-radius: 7px;
  color: var(--text);
  font: 12px 'JetBrains Mono', monospace;
  outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
#search:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
#search::placeholder { color:var(--text-3); }
.search-kbd {
  position:absolute;right:9px;
  font:500 9.5px 'JetBrains Mono',monospace;
  background:var(--surface-3);color:var(--text-3);
  padding:1px 5px;border-radius:3px;pointer-events:none;
  border:1px solid var(--border);
}
.clear-btn {
  position:absolute;right:8px;background:none;border:none;
  color:var(--text-3);font-size:11px;cursor:pointer;padding:3px;
  display:none;line-height:1;transition:color var(--t-fast);
}
.clear-btn:hover{color:var(--text)}
.side-content{flex:1;padding:4px 0 20px}

.cat {
  padding: 9px 13px 5px;
  font: 600 9.5px 'Inter', sans-serif;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
  transition: color var(--t-fast);
  margin-top: 6px;
}
.cat:hover{color:var(--text)}
.cat-left{display:flex;align-items:center;gap:7px}
.cat-badge {
  color: var(--text-3);
  font: 600 9px 'JetBrains Mono',monospace;
  background: var(--surface-3);
  padding: 1px 6px; border-radius:100px;
  border: 1px solid var(--border);
}
.cat-arrow{ color:var(--text-3);font-size:8px;transition:transform var(--t-med); }
.cat.collapsed .cat-arrow{transform:rotate(-90deg)}
.it-group{overflow:hidden;transition:max-height 0.22s ease}
.it {
  padding: 5px 13px 5px 16px;
  font: 400 12px/1.4 'Inter', sans-serif;
  color: var(--text-2);
  cursor:pointer;display:flex;align-items:center;gap:8px;
  border-left: 2px solid transparent;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.it-dot {
  width:4px;height:4px;border-radius:50%;
  background:var(--surface-4);flex-shrink:0;
  transition: background var(--t-fast), box-shadow var(--t-fast);
}
.it:hover{ background:var(--surface-2);color:var(--text); }
.it:hover .it-dot{ background:var(--accent); }
.it.on {
  background: linear-gradient(90deg, rgba(99,179,237,0.12) 0%, transparent 100%);
  color: var(--text);font-weight:500;
  border-left-color: var(--accent);
}
.it.on .it-dot{ background:var(--accent);box-shadow:0 0 5px var(--accent); }

/* ── CENTER CANVAS ───────────────────────────────────────────── */
#mid {
  overflow-y: auto;
  padding: 20px 26px 36px;
  display:flex;flex-direction:column;
  background: radial-gradient(ellipse at 60% 0%, rgba(66,153,225,0.06) 0%, transparent 55%);
}
.mid-header{margin-bottom:0}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#dsname {
  font: 800 24px/1.2 'Inter', sans-serif;
  letter-spacing: -0.025em;
  background: linear-gradient(135deg, #e2e8f0 0%, #a0c4e8 100%);
  -webkit-background-clip: text; background-clip: text; color:transparent;
}
#dscat {
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid rgba(99,179,237,0.3);
  font: 600 9.5px 'JetBrains Mono', monospace;
  letter-spacing: 0.12em; text-transform:uppercase;
  padding: 3px 9px; border-radius:5px;
}
#dsblurb {
  color: var(--text-2);
  font: 400 13px/1.65 'Inter', sans-serif;
  max-width: 740px;
  margin-top: 7px;
}
#cxrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cx {
  display:inline-flex;align-items:center;
  padding: 3px 9px;
  border: 1px solid rgba(246,173,85,0.25);
  background: var(--amber-dim);
  border-radius: 5px;
  font: 500 10.5px 'JetBrains Mono', monospace;
  color: var(--amber);
}

/* ── CANVAS STAGE ────────────────────────────────────────────── */
#stage-wrap {
  margin-top: 18px;
  border: 1px solid var(--border-h);
  border-radius: 12px;
  background: #090e18;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(66,153,225,0.08) 0%, transparent 60%),
    linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
  background-size: 100% 100%, 30px 30px, 30px 30px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.04);
  position:relative;overflow:hidden;
  transition: border-color var(--t-med), box-shadow var(--t-med);
}
#stage-wrap.active-op {
  border-color: rgba(99,179,237,0.5);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,179,237,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
}
#stage { display:block;width:100%;height:auto;min-height:240px; }

/* SVG text */
#stage text.t   { fill:#dde6f0; font:500 13px 'JetBrains Mono',monospace; }
#stage text.t.t-hot { fill:#ffffff;font-weight:700; }
#stage text.m   { fill:#4a6380; font:400 10.5px 'JetBrains Mono',monospace; }
#stage text.h   { fill:#546e8a; font:600 10px 'Inter',sans-serif; letter-spacing:0.14em;text-transform:uppercase; }
#stage text.h2  { fill:#dde6f0; font:700 14px 'Inter',sans-serif; }
#stage text.p   { fill:var(--accent); font:700 11px 'JetBrains Mono',monospace; }
#stage text.el  { fill:#7a9bbf; font:500 10px 'JetBrains Mono',monospace; paint-order:stroke;stroke:#090e18;stroke-width:3px; }

.svg-node,.svg-node-hot{transition:fill 0.18s ease,stroke 0.18s ease,stroke-width 0.18s ease}

/* ── ALGO HUD ────────────────────────────────────────────────── */
#algo-hud {
  margin-top: 10px;
  background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-1) 100%);
  border: 1px solid var(--border-h);
  border-radius: 8px;
  padding: 8px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow: var(--shadow-card);
  transition: border-color var(--t-fast);
}
.hud-tag {
  display:flex;align-items:center;gap:5px;
  font: 700 9px 'Inter',sans-serif; letter-spacing:0.14em;
  color: var(--accent); text-transform:uppercase;
  background: var(--accent-dim);
  border: 1px solid rgba(99,179,237,0.25);
  padding: 2px 8px; border-radius:4px; white-space:nowrap;
}
.hud-name{font:600 12px 'Inter',sans-serif;color:var(--text);white-space:nowrap}
.hud-divider{width:1px;height:16px;background:var(--border)}
.hud-exec{display:flex;align-items:center;gap:7px;flex:1;min-width:0;overflow:hidden}
.hud-line-num {
  font:600 9.5px 'JetBrains Mono',monospace;color:var(--accent);
  background:var(--accent-dim);border:1px solid rgba(99,179,237,0.2);
  padding:1px 5px;border-radius:3px;white-space:nowrap;
}
.hud-code{font:500 11.5px 'JetBrains Mono',monospace;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-badge{
  margin-left:auto;font:600 10px 'JetBrains Mono',monospace;
  color:var(--green);background:var(--green-dim);
  border:1px solid rgba(72,187,120,0.25);
  padding:2px 8px;border-radius:4px;white-space:nowrap;
}

/* ── TRACE TABS ──────────────────────────────────────────────── */
.trace-tabs {
  display:flex;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}
.tr-tab {
  flex:1;padding:9px 6px;background:transparent;
  border:0;border-bottom:2px solid transparent;
  color:var(--text-3);
  font:500 10.5px 'Inter',sans-serif;letter-spacing:0.04em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  transition: all var(--t-fast);
}
.tr-tab:hover{color:var(--text);background:var(--surface-2)}
.tr-tab.active {
  color:var(--accent);
  border-bottom-color:var(--accent);
  background: var(--accent-dim);
  font-weight:700;
}

/* algo pane / trace pane layout */
#algoPane{display:flex;flex-direction:column;background:var(--surface-1);overflow:hidden}
#trace.mode-split #algoPane{max-height:290px;border-bottom:1px solid var(--border);flex-shrink:0}
#trace.mode-algo  #algoPane{flex:1;max-height:none}
#trace.mode-steps #algoPane{display:none}
#tracePane{display:flex;flex-direction:column;overflow:hidden;min-height:0}
#trace.mode-algo  #tracePane{display:none}
#trace.mode-steps #tracePane{flex:1}
#trace.mode-split #tracePane{flex:1}

.algo-header{
  padding:10px 13px 8px;
  border-bottom:1px solid var(--border);
  background:var(--surface-2);
  flex-shrink:0;
}
.algo-title-row{display:flex;align-items:center;justify-content:space-between;gap:7px}
.algo-title{font:600 11.5px 'Inter',sans-serif;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.algo-cx {
  font:600 10px 'JetBrains Mono',monospace;
  color:var(--green);background:var(--green-dim);
  border:1px solid rgba(72,187,120,0.22);
  padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;
}
.algo-invariant{margin-top:3px;font:400 10.5px/1.4 'Inter',sans-serif;color:var(--text-3)}

/* Code block */
.algo-code-block{flex:1;overflow-y:auto;padding:6px 4px;background:#080c14}
.algo-line {
  display:flex;align-items:baseline;
  padding:2px 8px;border-radius:3px;
  border-left:2px solid transparent;
  color:var(--text-3);
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);
  cursor:pointer;
}
.algo-line:hover{background:rgba(99,179,237,0.06);color:var(--text-2)}
.algo-line.active{
  background:rgba(99,179,237,0.12);
  border-left-color:var(--accent);
  color:var(--text);
}
.algo-ln{min-width:22px;color:var(--text-3);font-size:9.5px;user-select:none;text-align:right;margin-right:8px}
.algo-line.active .algo-ln{color:var(--accent);font-weight:700}
.algo-arrow{display:inline-block;width:12px;font-size:8px;color:transparent;user-select:none;transition:color var(--t-fast)}
.algo-line.active .algo-arrow{color:var(--accent)}
.algo-txt{flex:1;white-space:pre}
.algo-txt .kw {color:#f687b3;font-weight:700}
.algo-txt .fn {color:var(--accent)}
.algo-txt .ty {color:#fc8181}
.algo-txt .num{color:var(--amber)}
.algo-txt .cm {color:var(--text-3);font-style:italic}

.algo-commentary {
  padding:7px 12px;
  border-top:1px solid var(--border);
  background:rgba(99,179,237,0.06);
  font:500 10.5px/1.45 'JetBrains Mono',monospace;
  color:var(--accent);
  min-height:33px;display:flex;align-items:center;gap:7px;flex-shrink:0;
}
.algo-commentary-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* ── OPS BAR ─────────────────────────────────────────────────── */
#opsbar{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.opc {
  background: linear-gradient(180deg, var(--surface-3) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border-h);
  border-radius: 8px;
  padding: 9px 11px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  box-shadow: var(--shadow-card);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.opc:hover{border-color:rgba(99,179,237,0.35);box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.opc .lbl{font:700 11px 'JetBrains Mono',monospace;color:var(--accent);white-space:nowrap}
.opc input,.opc select{
  background:var(--surface-0);border:1px solid var(--border-h);
  border-radius:5px;color:var(--text);
  font:500 11px 'JetBrains Mono',monospace;
  padding:5px 8px;outline:none;width:70px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast);
}
.opc input[type=text]{width:104px}
.opc input:focus,.opc select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.opc .pl{font:400 9.5px 'Inter',sans-serif;color:var(--text-3)}

.runb {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #060a10;
  border: 0;
  padding: 6px 14px;
  border-radius: 6px;
  font: 700 10.5px 'Inter', sans-serif;
  letter-spacing: 0.05em; text-transform:uppercase;
  cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  box-shadow: 0 2px 10px rgba(99,179,237,0.3);
  transition: all var(--t-fast);
}
.runb:hover{box-shadow:0 4px 16px rgba(99,179,237,0.5);transform:translateY(-1px)}
.runb:active{transform:scale(0.97);box-shadow:none}

.glob{margin-left:auto;display:flex;gap:7px}
.gb {
  background:var(--surface-3);border:1px solid var(--border-h);
  color:var(--text-2);padding:6px 11px;border-radius:6px;
  font:500 10.5px 'Inter',sans-serif;
  cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  transition:all var(--t-fast);
}
.gb:hover{border-color:rgba(99,179,237,0.35);color:var(--text);background:var(--accent-dim)}

/* ── RIGHT TRACE PANEL ───────────────────────────────────────── */
#trace {
  border-left:1px solid var(--border);
  background:var(--surface-0);
  display:flex;flex-direction:column;overflow:hidden;
}
#trhead {
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface-1) 100%);
  flex-shrink:0;
}
.tr-title{display:flex;align-items:center;gap:7px}
.tr-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
#trhead .t{font:800 10.5px 'Inter',sans-serif;letter-spacing:0.16em;color:var(--text)}
.tr-badge{font:500 9.5px 'JetBrains Mono',monospace;color:var(--text-3);background:var(--surface-3);padding:1px 5px;border-radius:3px}
#trctl{margin-left:auto;display:flex;gap:4px;align-items:center}
#trctl button {
  background:var(--surface-3);border:1px solid var(--border-h);
  color:var(--text);width:28px;height:27px;border-radius:5px;cursor:pointer;
  font:600 10.5px 'JetBrains Mono',monospace;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--t-fast);
}
#trctl button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);box-shadow:0 0 8px rgba(99,179,237,0.2)}
#trctl button.btn-play.playing{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#060a10;
  box-shadow:0 0 12px rgba(99,179,237,0.4);
}
#trctl select{
  background:var(--surface-3);border:1px solid var(--border-h);
  border-radius:5px;color:var(--text);
  padding:3px 6px;font:500 10px 'JetBrains Mono',monospace;outline:none;
}

.scrub-container{padding:9px 14px 3px;flex-shrink:0}
#scrub{width:100%;accent-color:var(--accent);cursor:pointer;height:4px;border-radius:100px}

#steps{flex:1;overflow-y:auto;padding:5px 6px;list-style:none}
.step {
  padding:6px 10px;
  font:400 11px/1.4 'JetBrains Mono',monospace;
  color:var(--text-3);cursor:pointer;
  display:flex;gap:8px;
  border-left:2px solid transparent;
  border-radius:0 5px 5px 0;
  margin-bottom:1px;
  transition:all var(--t-fast);
}
.step b{color:var(--text-3);font-weight:600;min-width:24px;text-align:right;font-size:9.5px}
.step:hover{background:var(--surface-2);color:var(--text-2)}
.step.on{
  background:linear-gradient(90deg,rgba(99,179,237,0.14) 0%,transparent 100%);
  color:var(--text);border-left-color:var(--accent);
}
.step.on b{color:#060a10;background:var(--accent);padding:0 3px;border-radius:2px}

#status {
  border-top:1px solid var(--border);
  padding:8px 14px;
  font:500 10.5px 'JetBrains Mono',monospace;
  color:var(--text-3);min-height:34px;
  background:var(--surface-1);
  display:flex;align-items:center;gap:7px;flex-shrink:0;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);flex-shrink:0;transition:background var(--t-fast),box-shadow var(--t-fast)}
.status-dot.busy{background:var(--amber);box-shadow:0 0 5px var(--amber)}

/* ── TOAST ───────────────────────────────────────────────────── */
#toast {
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:linear-gradient(135deg,var(--surface-3) 0%,var(--surface-2) 100%);
  border:1px solid var(--border-h);
  box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(99,179,237,0.15);
  color:var(--text);padding:8px 18px;border-radius:8px;
  font:500 11.5px 'JetBrains Mono',monospace;
  display:flex;align-items:center;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity var(--t-med),transform var(--t-med);z-index:100;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast-icon{color:var(--accent)}

@media(max-width:1100px){
  #cols{grid-template-columns:238px 1fr 300px}
  .cat-pill-bar{display:none}
}
@media(max-width:860px){
  body{overflow:auto}
  #cols{grid-template-columns:1fr;height:auto}
  #side{max-height:240px}
  #trace{max-height:340px}
}


  /* Text */
  --text-primary:  #e6edf3;
  --text-secondary:#8b949e;
  --text-muted:    #6e7681;

  /* Accents */
  --accent:     #58a6ff;
  --accent-dim: rgba(88,166,255,0.12);
  --accent-glow:rgba(88,166,255,0.25);
  --green:      #3fb950;
  --green-dim:  rgba(63,185,80,0.12);
  --red:        #f85149;
  --red-dim:    rgba(248,81,73,0.12);
  --yellow:     #d29922;
  --yellow-dim: rgba(210,153,34,0.12);
  --purple:     #bc8cff;
  --purple-dim: rgba(188,140,255,0.12);
  --teal:       #39d353;

  /* Node colour palette (matches JS PC object) */
  --node-cur:  #58a6ff;
  --node-vis:  #bc8cff;
  --node-ok:   #3fb950;
  --node-bad:  #f85149;
  --node-cmp:  #d29922;

  /* Shadows */
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:  0 4px 12px rgba(0,0,0,0.5);
  --shadow-lg:  0 8px 24px rgba(0,0,0,0.6);

  /* Transitions */
  --t-fast:  150ms ease;
  --t-med:   250ms ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── SCROLLBARS ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-4); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── HEADER ──────────────────────────────────────────────── */
#top {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
  position: relative;
  z-index: 20;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  cursor: default;
  flex-shrink: 0;
}
.brand-logo {
  width: 30px;
  height: 30px;
  background: var(--surface-3);
  border: 1px solid rgba(88,166,255,0.3);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
}
.brand-meta h1 {
  font: 700 14px/1 'Inter', sans-serif;
  letter-spacing: 0.06em;
  color: var(--text-primary);
  display: flex;
  align-items: center;
}
.brand-meta h1 .hi {
  color: var(--accent);
  margin-left: 1px;
}
.brand-meta .sub {
  color: var(--text-muted);
  font: 400 10px/1.2 'JetBrains Mono', monospace;
  margin-top: 2px;
}

/* Category pill bar */
.cat-pill-bar {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 3px 4px;
  margin: 0 auto 0 8px;
  max-width: 580px;
  scrollbar-width: none;
}
.cat-pill-bar::-webkit-scrollbar { display: none; }
.cpill {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font: 500 11px 'Inter', sans-serif;
  padding: 3px 9px;
  border-radius: 100px;
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  display: flex;
  align-items: center;
  gap: 4px;
}
.cpill:hover {
  background: var(--surface-3);
  color: var(--text-primary);
  border-color: var(--border-2);
}
.cpill.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: rgba(88,166,255,0.35);
}

.top-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.top-pill-btn {
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-secondary);
  padding: 4px 11px;
  border-radius: 6px;
  font: 500 11.5px 'Inter', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
}
.top-pill-btn:hover {
  background: var(--accent-dim);
  border-color: rgba(88,166,255,0.35);
  color: var(--accent);
}
.counter-badge {
  background: var(--green-dim);
  border: 1px solid rgba(63,185,80,0.2);
  color: var(--green);
  font: 500 11px 'JetBrains Mono', monospace;
  padding: 3px 9px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pulse-indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}

/* ── 3-COLUMN LAYOUT ─────────────────────────────────────── */
#cols {
  display: grid;
  grid-template-columns: 268px 1fr 348px;
  height: calc(100vh - 52px);
  background: var(--bg);
  overflow: hidden;
}

/* ── LEFT SIDEBAR ────────────────────────────────────────── */
#side {
  border-right: 1px solid var(--border);
  background: var(--surface-1);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.search-box-wrap {
  padding: 10px 12px;
  background: var(--surface-1);
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.search-inner {
  position: relative;
  display: flex;
  align-items: center;
}
.search-icon {
  position: absolute;
  left: 9px;
  color: var(--text-muted);
  pointer-events: none;
}
#search {
  width: 100%;
  padding: 7px 30px 7px 28px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  color: var(--text-primary);
  font: 12px 'JetBrains Mono', monospace;
  outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}
#search::placeholder { color: var(--text-muted); }
.search-kbd {
  position: absolute;
  right: 9px;
  font: 500 10px 'JetBrains Mono', monospace;
  background: var(--surface-3);
  color: var(--text-muted);
  padding: 1px 5px;
  border-radius: 3px;
  pointer-events: none;
  border: 1px solid var(--border);
}
.clear-btn {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  padding: 3px;
  display: none;
  line-height: 1;
  transition: color var(--t-fast);
}
.clear-btn:hover { color: var(--text-primary); }

.side-content { flex: 1; padding: 4px 0 16px; }
.cat {
  padding: 8px 12px 5px;
  font: 600 10px 'Inter', sans-serif;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  transition: color var(--t-fast);
  margin-top: 4px;
}
.cat:hover { color: var(--text-primary); }
.cat-left { display: flex; align-items: center; gap: 6px; }
.cat-badge {
  color: var(--text-muted);
  font: 500 9.5px 'JetBrains Mono', monospace;
  background: var(--surface-3);
  padding: 1px 5px;
  border-radius: 100px;
  border: 1px solid var(--border);
}
.cat-arrow {
  color: var(--text-muted);
  font-size: 8px;
  transition: transform var(--t-med);
}
.cat.collapsed .cat-arrow { transform: rotate(-90deg); }
.it-group { overflow: hidden; transition: max-height 0.22s ease; }
.it {
  padding: 5px 12px 5px 14px;
  font: 400 12px/1.4 'Inter', sans-serif;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-left: 2px solid transparent;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.it-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--surface-4);
  flex-shrink: 0;
  transition: background var(--t-fast);
}
.it:hover {
  background: var(--surface-2);
  color: var(--text-primary);
}
.it:hover .it-dot { background: var(--accent); }
.it.on {
  background: var(--accent-dim);
  color: var(--text-primary);
  font-weight: 500;
  border-left-color: var(--accent);
}
.it.on .it-dot { background: var(--accent); }

/* ── CENTER CANVAS ───────────────────────────────────────── */
#mid {
  overflow-y: auto;
  padding: 18px 24px 32px;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.mid-header { margin-bottom: 0; }
.title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
#dsname {
  font: 700 22px/1.2 'Inter', sans-serif;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
#dscat {
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid rgba(88,166,255,0.25);
  font: 500 10px 'JetBrains Mono', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
}
#dsblurb {
  color: var(--text-secondary);
  font: 400 13px/1.6 'Inter', sans-serif;
  max-width: 760px;
  margin-top: 6px;
}
#cxrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.cx {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border: 1px solid rgba(210,153,34,0.2);
  background: var(--yellow-dim);
  border-radius: 4px;
  font: 500 10.5px 'JetBrains Mono', monospace;
  color: var(--yellow);
}

/* Stage / Canvas */
#stage-wrap {
  margin-top: 16px;
  border: 1px solid var(--border-2);
  border-radius: 10px;
  background: var(--surface-1);
  background-image:
    linear-gradient(rgba(88,166,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,166,255,0.025) 1px, transparent 1px);
  background-size: 100% 100%, 28px 28px, 28px 28px;
  position: relative;
  overflow: hidden;
  transition: border-color var(--t-med);
}
#stage-wrap.active-op { border-color: rgba(88,166,255,0.45); }
#stage {
  display: block;
  width: 100%;
  height: auto;
  min-height: 220px;
}

/* SVG node and text classes */
#stage text.t   { fill: var(--text-primary); font: 500 13px 'JetBrains Mono', monospace; }
#stage text.t.t-hot { fill: #fff; font-weight: 700; }
#stage text.m   { fill: var(--text-muted); font: 400 10.5px 'JetBrains Mono', monospace; }
#stage text.h   { fill: var(--text-secondary); font: 600 10.5px 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
#stage text.h2  { fill: var(--text-primary); font: 700 14px 'Inter', sans-serif; }
#stage text.p   { fill: var(--accent); font: 700 11px 'JetBrains Mono', monospace; }
#stage text.el  { fill: #adbac7; font: 500 10px 'JetBrains Mono', monospace; paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; }

/* SVG node and edge — transitions powered by D3 */
.svg-node, .svg-node-hot {
  transition: fill 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease;
}

/* ── ALGO HUD ────────────────────────────────────────────── */
#algo-hud {
  margin-top: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 7px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color var(--t-fast);
}
.hud-tag {
  display: flex;
  align-items: center;
  gap: 5px;
  font: 700 9.5px 'Inter', sans-serif;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  background: var(--accent-dim);
  border: 1px solid rgba(88,166,255,0.2);
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
}
.hud-name {
  font: 600 12px 'Inter', sans-serif;
  color: var(--text-primary);
  white-space: nowrap;
}
.hud-divider { width: 1px; height: 16px; background: var(--border); }
.hud-exec {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.hud-line-num {
  font: 600 10px 'JetBrains Mono', monospace;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid rgba(88,166,255,0.2);
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
}
.hud-code {
  font: 500 11.5px 'JetBrains Mono', monospace;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hud-badge {
  margin-left: auto;
  font: 600 10.5px 'JetBrains Mono', monospace;
  color: var(--green);
  background: var(--green-dim);
  border: 1px solid rgba(63,185,80,0.22);
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ── TRACE TABS ──────────────────────────────────────────── */
.trace-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.tr-tab {
  flex: 1;
  padding: 8px 6px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font: 500 10.5px 'Inter', sans-serif;
  letter-spacing: 0.03em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.tr-tab:hover { color: var(--text-primary); background: var(--surface-2); }
.tr-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: var(--accent-dim);
  font-weight: 600;
}

/* Algo pane / trace pane layout */
#algoPane {
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  overflow: hidden;
  transition: max-height var(--t-med), display var(--t-med);
}
#trace.mode-split #algoPane { max-height: 280px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#trace.mode-algo  #algoPane { flex: 1; max-height: none; }
#trace.mode-steps #algoPane { display: none; }

#tracePane { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
#trace.mode-algo  #tracePane { display: none; }
#trace.mode-steps #tracePane { flex: 1; }
#trace.mode-split #tracePane { flex: 1; }

.algo-header {
  padding: 9px 12px 7px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  flex-shrink: 0;
}
.algo-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
}
.algo-title {
  font: 600 11.5px 'Inter', sans-serif;
  color: var(--text-primary);
}
.algo-cx {
  font: 600 10px 'JetBrains Mono', monospace;
  color: var(--green);
  background: var(--green-dim);
  border: 1px solid rgba(63,185,80,0.2);
  padding: 1px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.algo-invariant {
  margin-top: 3px;
  font: 400 10.5px/1.4 'Inter', sans-serif;
  color: var(--text-muted);
}

/* Code block — Prism-styled */
.algo-code-block {
  flex: 1;
  overflow-y: auto;
  padding: 6px 4px;
  font: 400 11.5px/1.55 'JetBrains Mono', monospace;
  background: #0d1117;
}
.algo-line {
  display: flex;
  align-items: baseline;
  padding: 2px 7px;
  border-radius: 3px;
  border-left: 2px solid transparent;
  color: var(--text-secondary);
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  cursor: pointer;
}
.algo-line:hover {
  background: var(--surface-2);
  color: var(--text-primary);
}
.algo-line.active {
  background: rgba(88,166,255,0.1);
  border-left-color: var(--accent);
  color: var(--text-primary);
}
.algo-ln {
  min-width: 22px;
  color: var(--text-muted);
  font-size: 9.5px;
  user-select: none;
  text-align: right;
  margin-right: 7px;
}
.algo-line.active .algo-ln { color: var(--accent); font-weight: 600; }
.algo-arrow {
  display: inline-block;
  width: 12px;
  font-size: 8px;
  color: transparent;
  user-select: none;
  transition: color var(--t-fast);
}
.algo-line.active .algo-arrow { color: var(--accent); }
.algo-txt { flex: 1; white-space: pre; }

/* Syntax tokens */
.algo-txt .kw  { color: #ff7b72; font-weight: 600; }
.algo-txt .fn  { color: #79c0ff; }
.algo-txt .ty  { color: #ff7b72; }
.algo-txt .num { color: #ffa657; }
.algo-txt .cm  { color: var(--text-muted); font-style: italic; }

.algo-commentary {
  padding: 7px 10px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  font: 500 10.5px/1.45 'JetBrains Mono', monospace;
  color: var(--accent);
  min-height: 32px;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.algo-commentary-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ── OPS BAR ─────────────────────────────────────────────── */
#opsbar {
  margin-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: stretch;
}
.opc {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 7px;
  padding: 8px 10px;
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
  transition: border-color var(--t-fast);
}
.opc:hover { border-color: rgba(88,166,255,0.3); }
.opc .lbl {
  font: 600 11px 'JetBrains Mono', monospace;
  color: var(--accent);
  white-space: nowrap;
}
.opc input, .opc select {
  background: var(--bg);
  border: 1px solid var(--border-2);
  border-radius: 5px;
  color: var(--text-primary);
  font: 500 11px 'JetBrains Mono', monospace;
  padding: 4px 7px;
  outline: none;
  width: 68px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.opc input[type=text] { width: 100px; }
.opc input:focus, .opc select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}
.opc .pl {
  font: 400 9.5px 'Inter', sans-serif;
  color: var(--text-muted);
}

.runb {
  background: var(--accent);
  color: #0d1117;
  border: 0;
  padding: 5px 12px;
  border-radius: 5px;
  font: 700 10.5px 'Inter', sans-serif;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: opacity var(--t-fast), transform var(--t-fast);
}
.runb:hover { opacity: 0.88; }
.runb:active { transform: scale(0.97); }

.glob { margin-left: auto; display: flex; gap: 7px; }
.gb {
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-secondary);
  padding: 5px 10px;
  border-radius: 5px;
  font: 500 10.5px 'Inter', sans-serif;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
}
.gb:hover {
  border-color: rgba(88,166,255,0.3);
  color: var(--text-primary);
  background: var(--accent-dim);
}

/* ── RIGHT TRACE PANEL ───────────────────────────────────── */
#trace {
  border-left: 1px solid var(--border);
  background: var(--surface-1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#trhead {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  flex-shrink: 0;
}
.tr-title { display: flex; align-items: center; gap: 7px; }
.tr-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
#trhead .t {
  font: 700 11px 'Inter', sans-serif;
  letter-spacing: 0.12em;
  color: var(--text-primary);
}
.tr-badge {
  font: 500 9.5px 'JetBrains Mono', monospace;
  color: var(--text-muted);
  background: var(--surface-3);
  padding: 1px 5px;
  border-radius: 3px;
}
#trctl {
  margin-left: auto;
  display: flex;
  gap: 4px;
  align-items: center;
}
#trctl button {
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  color: var(--text-primary);
  width: 28px;
  height: 26px;
  border-radius: 5px;
  cursor: pointer;
  font: 600 10.5px 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
#trctl button:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
#trctl button.btn-play.playing {
  background: var(--accent);
  border-color: transparent;
  color: #0d1117;
}
#trctl select {
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  border-radius: 5px;
  color: var(--text-primary);
  padding: 2px 5px;
  font: 500 10px 'JetBrains Mono', monospace;
  outline: none;
}

.scrub-container { padding: 8px 14px 3px; flex-shrink: 0; }
#scrub {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
  height: 4px;
  border-radius: 100px;
}

#steps {
  flex: 1;
  overflow-y: auto;
  padding: 4px 6px;
  list-style: none;
}
.step {
  padding: 6px 10px;
  font: 400 11px/1.4 'JetBrains Mono', monospace;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  gap: 8px;
  border-left: 2px solid transparent;
  border-radius: 0 5px 5px 0;
  margin-bottom: 1px;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.step b {
  color: var(--text-muted);
  font-weight: 600;
  min-width: 24px;
  text-align: right;
  font-size: 9.5px;
}
.step:hover { background: var(--surface-2); color: var(--text-primary); }
.step.on {
  background: var(--accent-dim);
  color: var(--text-primary);
  border-left-color: var(--accent);
}
.step.on b {
  color: #0d1117;
  background: var(--accent);
  padding: 0 3px;
  border-radius: 2px;
}

#status {
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  font: 500 10.5px 'JetBrains Mono', monospace;
  color: var(--text-muted);
  min-height: 34px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  transition: background var(--t-fast);
}
.status-dot.busy { background: var(--yellow); }

/* ── TOAST ───────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  box-shadow: var(--shadow-lg);
  color: var(--text-primary);
  padding: 7px 16px;
  border-radius: 6px;
  font: 500 11.5px 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  gap: 7px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-med), transform var(--t-med);
  z-index: 100;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
.toast-icon { color: var(--accent); }

@media(max-width: 1100px) {
  #cols { grid-template-columns: 230px 1fr 280px; }
  .cat-pill-bar { display: none; }
}
@media(max-width: 860px) {
  body { overflow: auto; }
  #cols { grid-template-columns: 1fr; height: auto; }
  #side { max-height: 240px; }
  #trace { max-height: 340px; }
}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <div class="brand-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>

    <div class="brand-meta">

      <div class="sub">interactive data-structure laboratory</div>

  <div class="cat-pill-bar" id="catBar"></div>

  <div class="top-meta">

</header>
<div id="cols">
  <aside id="side">
    <div class="search-box-wrap">
      <div class="search-inner">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" placeholder="Filter structures ( / )..." autocomplete="off" spellcheck="false">
        <span class="search-kbd">/</span>
        <button id="clearSearch" class="clear-btn" title="Clear search">✕</button>
      </div>
    </div>
    <div id="sideContent" class="side-content"></div>
  </aside>
  <main id="mid">
    <div class="mid-header">
      <div class="title-row">
        <h2 id="dsname"></h2>
        <span id="dscat"></span>
      </div>
      <p id="dsblurb"></p>
      <div id="cxrow"></div>
    </div>
    <div id="stage-wrap">
      <svg id="stage" viewBox="0 0 960 300"></svg>
    </div>
    <div id="opsbar"></div>
  </main>
  <aside id="trace" class="mode-split">
    <div class="trace-tabs" id="traceTabs">
      <button class="tr-tab active" data-tab="split" title="Split View: Algorithm + Trace">⚡ Split</button>
      <button class="tr-tab" data-tab="algo" title="Algorithm Pseudocode">⌨ Code</button>
      <button class="tr-tab" data-tab="steps" title="Execution Steps Log">📜 Trace</button>
    </div>
    <div id="algoPane">
      <div class="algo-header">
        <div class="algo-title-row">
          <span id="algoTitle" class="algo-title">Algorithm</span>
          <span id="algoComplexity" class="algo-cx">O(1)</span>

      <div id="algoCode" class="algo-code-block"></div>

      </div>

            <option value="1500">0.25×</option>

            <option value="200">2×</option>

          <button id="bprev" title="Previous step (Left Arrow)">◂</button>

        <input type="range" id="scrub" min="0" max="0" value="0">

  </aside>
</div>
<div id="toast"><span class="toast-icon">⚡</span><span id="toastMsg"></span></div>
<script>
"use strict";
/* ================= CORE ================= */
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
const PC={cur:'#58a6ff',vis:'#bc8cff',ok:'#3fb950',bad:'#f85149',cmp:'#d29922'};
(function(){const d=document.createElementNS(NS,'defs');
  [['arA','#58a6ff'],['arI','#3d4d63'],['arT','#39d353'],['arOk','#3fb950'],['arBad','#f85149'],['arVis','#bc8cff']].forEach(p=>{
    const m=document.createElementNS(NS,'marker');m.setAttribute('id',p[0]);m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX',9);m.setAttribute('refY',5);m.setAttribute('markerWidth',7);m.setAttribute('markerHeight',7);m.setAttribute('orient','auto-start-reverse');
    const pa=document.createElementNS(NS,'path');pa.setAttribute('d','M0 0 L10 5 L0 10 z');pa.setAttribute('fill',p[1]);m.appendChild(pa);d.appendChild(m);});
  stage.appendChild(d);})();
const G=document.createElementNS(NS,'g');stage.appendChild(G);
function E(tag,at){const n=document.createElementNS(NS,tag);for(const k in at)n.setAttribute(k,at[k]);G.appendChild(n);return n;}
function TX(x,y,s,cls,anc){const t=E('text',{x:x,y:y,'text-anchor':anc||'middle','class':cls||'t'});t.textContent=String(s);return t;}
function LN(x1,y1,x2,y2,o){o=o||{};return E('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:o.c||'#2d3d56','stroke-width':o.w||1.4,'stroke-dasharray':o.dash||'none',...(o.mk?{'marker-end':'url(#'+o.mk+')'}:{})});}
function fmt(v){if(v===null||v===undefined)return'·';if(typeof v==='number')return Math.round(v*1000)/1000+'';return String(v);}
function cell(x,y,w,hh,val,col,sub,small){
  const hot=!!col;
  const r=E('rect',{x:x,y:y,width:w,height:hh,rx:5,fill:col?col+'28':'#1c2330',stroke:col||'#2d3d56','stroke-width':col?2:1.2,class:hot?'svg-node-hot':'svg-node'});
  if(hot)r.style.color=col;
  if(val!==null&&val!==undefined){const t=TX(x+w/2,y+hh/2+(small?3:4),fmt(val),'t'+(hot?' t-hot':''));if(hot)t.style.fill='#ffffff';}
  if(sub!=null)TX(x+w/2,y+hh+13,sub,'m');
}
/* ---- view engines ---- */
const ENG={
row(d,hl,y,id){
  const cap=d.cap!=null?d.cap:Math.max(1,d.a.length);
  const w=d.w||46,hh=d.hh||34,gap=d.gap!=null?d.gap:6;
  const tot=cap*(w+gap)-gap,x0=(960-tot)/2;
  for(let i=0;i<cap;i++){
    const col=hl[id+':'+i]?PC[hl[id+':'+i]]:null;
    if(i<d.a.length)cell(x0+i*(w+gap),y,w,hh,d.a[i],col,d.subs?d.subs[i]:null,w<=36);
    else{E('rect',{x:x0+i*(w+gap),y:y,width:w,height:hh,rx:6,fill:'none',stroke:'rgba(255,255,255,0.08)','stroke-dasharray':'4 4'});TX(x0+i*(w+gap)+w/2,y+hh/2+4,'·','m');}
  }
  let extra=6;
  if(d.subs)extra+=14;
  if(d.ptr){for(const nm in d.ptr){const i=d.ptr[nm];if(i==null||i<0||i>=cap)continue;
    const px=x0+i*(w+gap)+w/2,py=y+hh+(d.subs?26:16);
    const pth=E('path',{d:'M'+px+' '+py+' l-5 8 h10 z',fill:PC.cur,class:'svg-node-hot'});pth.style.color=PC.cur;TX(px,py+26,nm,'p');}extra+=46;}
  return hh+extra;
},
ring(d,hl,y,id){
  const cap=d.cap!=null?d.cap:Math.max(1,d.a.length);
  const R=Math.min(135,60+cap*10),cx=480,cy=y+R+34;
  for(let i=0;i<cap;i++){
    const a=-Math.PI/2+i*2*Math.PI/cap,x=cx+R*Math.cos(a),yy=cy+R*Math.sin(a);
    const col=hl[id+':'+i]?PC[hl[id+':'+i]]:null;

  }
  if(d.ptr)for(const nm in d.ptr){const i=d.ptr[nm];if(i==null||i<0||i>=cap)continue;

    TX(cx+(R-88)*Math.cos(a),cy+(R-88)*Math.sin(a),nm,'p');}

},
grid(d,hl,y,id){
  const g=d.g||[],rows=g.length;
  if(!rows||!g[0])return 24;
  const cols=g[0].length,cw=d.cw||56,chh=d.chh||38;
  const x0=(960-cols*cw)/2,y0=y+(d.head?22:0);
  if(d.head)for(let c=0;c<cols;c++)TX(x0+c*cw+(cw-2)/2,y+12,d.head[c],'h');
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const col=hl[id+':'+r+','+c]?PC[hl[id+':'+r+','+c]]:null;
    const band=d.band?d.band[r]:null;
    const rect=E('rect',{x:x0+c*cw,y:y0+r*chh,width:cw-2,height:chh-2,rx:5,fill:col?col+'30':(band?band+'16':'#101626'),stroke:col||'#26344d','stroke-width':col?2.4:1.2,class:col?'svg-node-hot':'svg-node'});

},
stack(d,hl,y,id){
  const n=d.a.length,hh=32,gap=5,w=d.w||64,x=480-w/2;
  const yb=y+n*(hh+gap);
  for(let i=0;i<n;i++){const col=hl[id+':'+i]?PC[hl[id+':'+i]]:null;
    cell(x,yb-(i+1)*(hh+gap)+gap,w,hh,d.a[i],col,null);}

  TX(480,yb+16,d.label||'','h');
  return n*(hh+gap)+30;
},
list(d,hl,y,id){
  const n=d.L.length,w=d.w||60,gap=34;
  const tot=n*(w+gap)-gap,x0=(960-tot)/2+26;
  TX(x0-32,y+21,'head','p');
  if(!n){TX(480,y+20,'(empty)','m');return 44;}
  for(let i=0;i<n;i++){
    const col=hl[id+':'+i]?PC[hl[id+':'+i]]:null;
    cell(x0+i*(w+gap),y,w,36,d.L[i].v,col,d.L[i].sub);
    if(i<n-1){
      const l1=LN(x0+i*(w+gap)+w+2,y+13,x0+(i+1)*(w+gap)-4,y+13,{c:'#3b4a6b',w:1.5,mk:'arI'});
      if(d.dbl){LN(x0+(i+1)*(w+gap)-4,y+26,x0+i*(w+gap)+w+2,y+26,{c:'#26344d',w:1.2,mk:'arI'});}
    }}
  if(d.circ&&n>1){const xr=x0+(n-1)*(w+gap)+w/2;
    E('path',{d:'M'+xr+' '+(y+38)+' C '+xr+' '+(y+88)+' '+(x0+w/2)+' '+(y+88)+' '+(x0+w/2)+' '+(y+42),fill:'none',stroke:'#3b4a6b','stroke-width':1.5,'marker-end':'url(#arI)'});

},
tree(d,hl,y,id){
  const nd=d.nd,roots=Array.isArray(d.rt)?d.rt:(d.rt!=null?[d.rt]:[]);
  if(!roots.length||!nd[roots[0]]){TX(480,y+24,'(empty)','m');return 44;}
  const K={};
  for(const k in nd){
    const raw=Array.isArray(nd[k].kids)?nd[k].kids:Object.values(nd[k].kids||{});
    K[k]=raw.filter(c=>c!=null&&nd[c]);
  }
  const X={},Y={},W={};let cur=0;
  const gw=d.gw||44,gh=d.gh||32;
  const visM=new Set();
  roots.forEach(function meas(r){
    if(visM.has(r))return;visM.add(r);
    const ks=K[r]||[];
    W[r]=Math.max(gw,String(nd[r].v==null?'':nd[r].v).length*8.5+16);
    if(!ks.length){X[r]=cur+W[r]/2;cur+=W[r]+14;}
    else{ks.forEach(meas);const xs=ks.map(k=>X[k]||cur);X[r]=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;}});
  const visD=new Set();
  roots.forEach(function dep(r){Y[r]=0;(function go(i){
    if(visD.has(i))return;visD.add(i);
    (K[i]||[]).forEach(k=>{Y[k]=(Y[i]||0)+1;go(k);});})(r);});
  let maxD=0;for(const k in Y)maxD=Math.max(maxD,Y[k]);
  const vgap=d.vgap||76,natW=Math.max(1,cur-14);

def('Strings','Trie-embedded string','The string lives against a dictionary stored as a trie: each character of the query walks exactly one edge.','O(m) lookup',()=>{

      if(!k){k=st.nid++;st.nd[k]={v:ch,eb:ch,kids:[],end:0};st.nd[cur].kids.push(k);}cur=k;}

function listMake(vals,opts){
  const D=Object.assign({L:vals.map(v=>({v:v}))},opts||{});
  const parts=[LIST('l',D)];
  const ins=(i,v)=>D.L.splice(i,0,{v:v});
  return{parts:parts,D:D,ops:[
    op('insert head v',x=>{ins(0,x.v);tr('new node → next = old head; head = new node — O(1)',h('l:0','ok'));},[prm('v','value','n',5)]),
    op('insert after i',x=>{const i=Math.min(D.L.length-1,Math.max(0,x.i|0));ins(i+1,x.v);
      tr('rewire: node['+i+'].next = new('+x.v+'); new.next = old node['+(i+1)+']',h2('l:'+(i+1),'ok','l:'+i,'cur'));},[prm('i','after idx','n',1),prm('v','value','n',9)]),
    op('delete value v',x=>{const i=D.L.findIndex(nd=>nd.v===x.v);
      if(i<0){tr(x.v+' not found after walking the whole list — O(n)');return;}
      tr('unlink node['+i+'] — predecessor now points past it',h('l:'+i,'bad'));
      D.L.splice(i,1);tr('removed; node returned to memory');},[prm('v','value','n',11)]),
    op('reverse in place',()=>{const orig=D.L.slice(),done=[];
      while(orig.length){const nd=orig.shift();done.unshift(nd);
        D.L=done.concat(orig);
        tr('rewire node('+nd.v+'): next = '+(done[1]?done[1].v:'null'),h('l:0','cur'));}
      D.L=done;
      tr('every pointer flipped in one pass — O(n), O(1) extra space');})]};
}

def('Linked Lists','Skip list','Towers of lanes over a sorted list: coin flips decide each node height, giving expected O(log n) search via express lanes.','expected O(log n)',()=>{

  const st={parts:parts};
  st.ops=[
    op('insert v (coin flips)',x=>{const v=x.v;let lvl=0;const flips=[];
      while(lvl<3&&Math.random()<0.5){lvl++;flips.push('HEAD');}flips.push('TAIL');
      tr('coin flips: '+flips.join(', ')+' → tower height '+(lvl+1));
      const names=['L0','L1','L2'];
      for(let l=0;l<=lvl;l++){const L=lanes[names[l]];let i=0;
        while(i<L.length&&L[i]<v)i++;L.splice(i,0,v);
        tr('splice '+v+' into lane '+l,h(names[l]+':'+i,'ok'));}},
      [prm('v','value','n',15)]),
    op('search v',x=>{const v=x.v;let l=2,i=-1;
      tr('start at the top lane');

        while(j<L.length&&L[j]<v){tr('L'+l+': '+L[j]+' < '+v+' — advance',h('L'+l+':'+j,'vis'));i=j;j++;}
        if(j<L.length&&L[j]===v){tr('L'+l+': found '+v+' — tower reached',h('L'+l+':'+j,'ok'));return;}
        tr('L'+l+': next is '+(j<L.length?L[j]:'∞')+' ≥ '+v+' — drop down');l--;if(i>=lanes['L'+(l+1)].length)i=lanes['L'+(l+1)].length-1;}

def('Linked Lists','Sorted linked list','Insertion walks to the first node that exceeds the new value — always sorted, at O(n) insert cost.','O(n) insert · merge-friendly',()=>{

def('Linked Lists','Self-organizing list','Reordering on access: frequently used items migrate toward the front, so future lookups get shorter.','amortized: hot items near head',()=>{

function monoStack(name,greater){
  const IN={a:greater?[3,1,4,1,5,9,2,6]:[9,6,8,3,5,2,7],w:52,ptr:{i:-1}};
  const SK={a:[],label:name};
  const OUT={a:[],w:52};
  const idx=[];
  const parts=[ROW('in',IN,'input (scan →)'),STACK('sk',SK),ROW('out',OUT,'result per input element')];
  const st={parts:parts};
  st.ops=[op('solve in one sweep',()=>{
    SK.a=[];OUT.a=IN.a.map(()=>'·');idx.length=0;
    for(let i=0;i<IN.a.length;i++){IN.ptr.i=i;const v=IN.a[i];
      while(SK.a.length&&(greater?SK.a[SK.a.length-1]<v:SK.a[SK.a.length-1]>v)){
        const pv=SK.a.pop(),pi=idx.pop();OUT.a[pi]=v;
        tr(pv+(greater?' < ':' > ')+v+' → pop; answer for '+pv+' is '+v);}
      SK.a.push(v);idx.push(i);tr('push '+v+' — the stack stays strictly '+(greater?'increasing':'decreasing'),h('sk:'+(SK.a.length-1),'ok'));}
    IN.ptr.i=-1;
    tr('every element pushed and popped at most once — O(n) total');})];
  return st;
}
def('Stacks','Monotonic increasing stack','Values only grow from bottom to top: a smaller arrival pops everything above it. One pass answers "next greater element".','O(n) amortized',()=>monoStack('increasing',true));
def('Stacks','Monotonic decreasing stack','The mirror image: a larger arrival pops the smaller ones above it. Answers "next smaller element" and underlies histogram tricks.','O(n) amortized',()=>monoStack('decreasing',false));
function minmaxStack(name,isMin){
  const A={a:[],label:'main'},B={a:[],label:name+'-shadow'};
  const parts=[STACK('a',A),STACK('b',B)];
  return{parts:parts,ops:[
    op('push(v)',x=>{A.a.push(x.v);
      const best=B.a.length?(isMin?Math.min(x.v,B.a[B.a.length-1]):Math.max(x.v,B.a[B.a.length-1])):x.v;
      B.a.push(best);tr('main ← '+x.v+'; shadow ← '+best,h2('a:'+(A.a.length-1),'ok','b:'+(B.a.length-1),'ok'));},[prm('v','value','n',5)]),
    op('pop()',()=>{if(!A.a.length){tr('underflow');return;}
      tr('pop '+A.a.pop()+'; shadow pops in lockstep');B.a.pop();}),
    op('get'+(isMin?'Min':'Max')+'()',()=>{if(!B.a.length){tr('empty');return;}
      tr('current '+(isMin?'minimum':'maximum')+' = '+B.a[B.a.length-1]+' — one peek, no scanning',h('b:'+(B.a.length-1),'cur'));})],
    example(){[isMin?5:2,isMin?3:9,isMin?8:4,isMin?1:7,isMin?6:1].forEach(v=>{
      A.a.push(v);B.a.push(B.a.length?(isMin?Math.min(v,B.a[B.a.length-1]):Math.max(v,B.a[B.a.length-1])):v);});}};
}

def('Stacks','Explicit recursion stack','Every recursive call pushes a frame; every return pops one. factorial(n) visualizes the machine you never see.','O(depth) frames',()=>{
  const FR={a:[],label:'call stack',w:90};
  const TT=TXT('r',{t:'return value: 1'});
  const st={parts:[STACK('f',FR),TT],sync:()=>{TT.d.t='return value so far: '+st.ret;}};
  st.ret=1;
  st.ops=[
    op('factorial(n)',x=>{FR.a=[];st.ret=1;const n=Math.min(10,Math.max(1,x.n|0));
      for(let i=n;i>=1;i--){FR.a.push('f('+i+')');tr('call f('+i+') → frame pushed (needs f('+(i-1)+'))',h('f:'+(FR.a.length-1),'ok'));}
      tr('base case reached: f(1) = 1 — now the frames unwind');
      while(FR.a.length){const i=+FR.a.pop().slice(2,-1);st.ret*=i;
        tr('f('+i+') returns '+st.ret+' — frame popped',h('f:'+FR.a.length,'vis'));}
      tr('f('+n+') = '+st.ret);},[prm('n','n','n',5)]),
    op('fib(n) depth',x=>{FR.a=[];st.ret=0;const n=Math.min(7,Math.max(1,x.n|0));

def('Queues','Double-ended priority queue','A max-heap of the lower half and a min-heap of the upper half, kept in lockstep — both extremes O(log n).','O(log n) min & max',()=>{
  const lo=[6,3,1],hi=[9,12];
  const T1=TREE('lo',{nd:{},rt:null,gw:40,vgap:60,x0:20,x1:460}),T2=TREE('hi',{nd:{},rt:null,gw:40,vgap:60,x0:500,x1:940});
  const mk=a=>{const nd={};a.forEach((v,i)=>{nd[i]={v:v,kids:[]};});
    a.forEach((v,i)=>{if(2*i+1<a.length)nd[i].kids.push(String(2*i+1));if(2*i+2<a.length)nd[i].kids.push(String(2*i+2));});return nd;};
  const st={parts:[T1,T2],sync:()=>{T1.d.nd=mk(lo);T1.d.rt=lo.length?'0':null;T2.d.nd=mk(hi);T2.d.rt=hi.length?'0':null;}};

    op('insert(v)',x=>{const v=x.v;
      if(!lo.length||v<=lo[0]){lo.push(v);tr(v+' joins the lower half');}

    op('getMin / getMax',()=>{tr('min = '+(lo.length?Math.min(...lo):'·')+' · max = '+(hi.length?Math.max(...hi):'·')+' — two roots, one glance');})];

});

def('Queues','Queue of pairs','BFS lives here: each frame is a (row, col) coordinate; the queue breathes outward in rings of distance.','BFS in O(V+E)',()=>{

function meldHeap(name,alwaysSwap,blurb2){
  let root={v:3,l:{v:8,l:null,r:null},r:{v:6,l:null,r:null}};
  const TP=TREE('m',{nd:{},rt:null,gw:40,vgap:60});

    const nd={};
    (function add(nid,node){if(!node)return;
      nd[nid]={v:node.v,kids:[]};
      if(node.l){nd[nid].kids.push(nid+'L');add(nid+'L',node.l);}
      if(node.r){nd[nid].kids.push(nid+'R');add(nid+'R',node.r);}})('n',root);
    TP.d.nd=nd;TP.d.rt='n';}};
  const npl=n=>!n?-1:1+Math.min(npl(n.l),npl(n.r));
  function meld(a,b){if(!a)return b;if(!b)return a;
    if(a.v>b.v){const t=a;a=b;b=t;}
    tr('meld: '+a.v+' stays root; recurse right of '+a.v+' with '+b.v);
    a.r=meld(a.r,b);
    if(alwaysSwap){tr('at '+a.v+': unconditionally swap children (self-adjusting)');
      const t=a.l;a.l=a.r;a.r=t;}
    else if(npl(a.l)<npl(a.r)){tr('npl(left)='+npl(a.l)+' < npl(right)='+npl(a.r)+' at '+a.v+' → swap children');
      const t=a.l;a.l=a.r;a.r=t;}
    return a;}
  st.ops=[
    op('insert v (meld)',x=>{root=meld(root,{v:x.v,l:null,r:null});tr('melded in O(log n) by right-spine descent');},[prm('v','value','n',5)]),
    op('extract-min',()=>{if(!root){tr('empty');return;}
      tr('min = '+root.v);root=meld(root.l,root.r);tr('children melded — shape preserved');})];
  return st;
}
