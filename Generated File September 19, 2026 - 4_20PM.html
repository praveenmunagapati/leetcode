<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Structures — Animated Simulator</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--panel3:#30363d;--bd:#30363d;--tx:#c9d1d9;--mu:#8b949e;--ac:#58a6ff;--gr:#7ee787;--wa:#f0883e;--da:#f85149;--pu:#bc8cff;--cy:#79c0ff;--ye:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 6px}
.sidebar h1{font-size:13px;font-weight:700;margin-bottom:2px;padding:0 8px;background:linear-gradient(135deg,var(--ac),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar .sub{font-size:10px;color:var(--mu);margin-bottom:10px;padding:0 8px}
.cat{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:700;margin:8px 8px 3px;cursor:pointer;user-select:none;display:flex;justify-content:space-between}
.cat::after{content:"▾"}
.cat.c::after{content:"▸"}
.item{padding:4px 9px;border-radius:5px;cursor:pointer;font-size:11.5px;color:var(--tx);border-left:2px solid transparent;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:var(--panel2)}
.item.a{background:rgba(88,166,255,.14);color:var(--ac);border-left-color:var(--ac);font-weight:600}
main{display:grid;grid-template-rows:auto 1fr auto auto;height:100vh;overflow:hidden}
.header{padding:12px 18px 8px;border-bottom:1px solid var(--bd)}
.header h2{font-size:16px;font-weight:700;margin-bottom:2px}
.header .desc{font-size:12px;color:var(--mu);max-width:900px}
.header .cx{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.cxb{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--bd);color:var(--mu);font-family:monospace}
.cxb.t{color:var(--gr);border-color:rgba(126,231,135,.3)}
.cxb.s{color:var(--wa);border-color:rgba(240,136,62,.3)}
.viz-wrap{padding:12px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.viz{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:auto;transition:all .2s}
.ops{padding:8px 18px;border-top:1px solid var(--bd);background:var(--panel);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:44px}
.ops button{background:var(--panel2);border:1px solid var(--bd);color:var(--tx);padding:6px 12px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.ops button:hover:not(:disabled){border-color:var(--ac);background:var(--panel3)}
.ops button:disabled{opacity:.4;cursor:not-allowed}
.ops button.primary{background:var(--ac);border-color:var(--ac);color:#0d1117}
.ops button.primary:hover:not(:disabled){opacity:.9}
.msg{padding:8px 18px;background:var(--panel2);font-size:12px;font-family:monospace;color:var(--tx);border-top:1px solid var(--bd);min-height:34px;display:flex;align-items:center}
.msg b{color:var(--gr)}
.msg .step{color:var(--ye);font-weight:600;margin-right:6px}
/* RENDERERS */
.cw{display:flex;flex-direction:column;align-items:center;gap:8px}
.cells{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding-bottom:16px}
.cell{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--bd);border-radius:7px;font-weight:700;font-size:13px;position:relative;font-family:monospace;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.cell .ix{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mu);font-weight:400}
.cell.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:translateY(-4px) scale(1.08)}
.cell.g{background:rgba(126,231,135,.35);border-color:var(--gr);transform:translateY(-4px) scale(1.08)}
.cell.r{background:rgba(248,81,73,.3);border-color:var(--da);transform:translateY(-4px)}
.cell.p{background:rgba(188,140,255,.3);border-color:var(--pu)}
.cell.dim{opacity:.25}
.cell.sm{width:36px;height:36px;font-size:11px}
.cell.new{animation:pop .4s}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.cell.rm{animation:fadeout .4s forwards}
@keyframes fadeout{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.bars{display:flex;gap:5px;align-items:flex-end;height:200px;justify-content:center}
.bar{width:38px;background:linear-gradient(180deg,#58a6ff,#1f6feb);border-radius:5px 5px 0 0;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px 3px;font-size:10px;font-weight:700;color:#0d1117;position:relative;min-height:20px;font-family:monospace;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.bar .ix{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mu);font-weight:400}
.bar.h{background:linear-gradient(180deg,#e3b341,#bf8700);transform:translateY(-6px)}
.bar.g{background:linear-gradient(180deg,#7ee787,#2ea043)}
.bar.r{background:linear-gradient(180deg,#f85149,#8b1a1a)}
.bar.p{background:linear-gradient(180deg,#bc8cff,#8957e5)}
.grid{display:inline-grid;gap:3px}
.gc{min-width:34px;height:34px;padding:0 5px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--bd);border-radius:5px;font-size:11px;font-family:monospace;font-weight:600;transition:all .3s}
.gc.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:scale(1.08)}
.gc.g{background:rgba(126,231,135,.35);border-color:var(--gr);transform:scale(1.08)}
.gc.p{background:rgba(188,140,255,.35);border-color:var(--pu);transform:scale(1.08)}
.gc.hd{background:var(--panel3);color:var(--mu);font-weight:700}
.ll-view{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.ll-box{min-width:48px;height:46px;padding:0 10px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--bd);border-radius:7px;font-family:monospace;font-weight:700;font-size:13px;position:relative;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.ll-box .lbl{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mu);font-weight:600;white-space:nowrap}
.ll-box.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:translateY(-4px) scale(1.08)}
.ll-box.g{background:rgba(126,231,135,.35);border-color:var(--gr);transform:translateY(-4px) scale(1.08)}
.ll-box.new{animation:pop .4s}
.ll-box.rm{animation:fadeout .4s forwards}
.ll-arrow{color:var(--mu);margin:0 3px;font-size:13px}
.stack-view{display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.sbox{width:76px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--bd);border-radius:6px;font-family:monospace;font-weight:700;font-size:13px;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.sbox.top{border-color:var(--gr);background:rgba(126,231,135,.15)}
.sbox.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:scale(1.06)}
.sbox.new{animation:pop .4s}
.sbox.rm{animation:fadeout .4s forwards}
.sbase{width:90px;height:4px;background:var(--bd);border-radius:2px;margin-top:4px}
.queue-view{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.qbox{width:46px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--bd);border-radius:6px;font-family:monospace;font-weight:700;font-size:12px;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.qbox.front{border-color:var(--gr)}
.qbox.back{border-color:var(--wa)}
.qbox.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:scale(1.08)}
.qbox.new{animation:pop .4s}
.qbox.rm{animation:fadeout .4s forwards}
.hash-view{display:flex;flex-direction:column;gap:4px;width:100%;max-width:640px}
.hrow{display:flex;align-items:center;gap:6px}
.hbucket{min-width:42px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1.5px solid var(--bd);border-radius:6px;font-family:monospace;font-weight:700;font-size:11px;transition:all .35s}
.hbucket.h{background:rgba(227,179,65,.35);border-color:var(--ye)}
.hchain{display:flex;gap:3px;flex-wrap:wrap}
.hentry{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:4px;font-family:monospace;font-size:11px;transition:all .3s}
.hentry.h{background:rgba(126,231,135,.3);border-color:var(--gr)}
.hentry.new{animation:pop .4s}
.harrow{color:var(--mu);font-size:11px}
.kv-view{display:flex;flex-direction:column;gap:3px;font-family:monospace;font-size:12px;max-width:500px;width:100%}
.kv-row{display:flex;gap:8px;padding:4px 10px;background:var(--panel2);border-radius:4px;transition:all .3s}
.kv-row.h{background:rgba(227,179,65,.3)}
.kv-row .k{color:var(--cy);font-weight:600;min-width:60px}
.kv-row .v{color:var(--tx)}
.uf-view{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.uf-group{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:100px;transition:all .3s}
.uf-group.h{border-color:var(--gr);box-shadow:0 0 0 2px rgba(126,231,135,.3)}
.uf-group .title{font-size:10px;color:var(--mu);text-transform:uppercase;font-weight:700;margin-bottom:5px}
.uf-chips{display:flex;gap:4px;flex-wrap:wrap}
.uf-chip{padding:3px 9px;border-radius:5px;font-family:monospace;font-weight:700;font-size:11px;background:var(--panel3);color:var(--tx);transition:all .3s}
.uf-chip.root{background:var(--gr);color:#0d1117}
.uf-chip.h{background:var(--ye);color:#0d1117;transform:scale(1.1)}
.bits{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.bit{width:26px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;font-family:monospace;font-weight:700;font-size:11px;transition:all .3s}
.bit.on{background:rgba(126,231,135,.25);border-color:var(--gr);color:var(--gr)}
.bit.h{background:rgba(227,179,65,.35);border-color:var(--ye);transform:scale(1.15)}
.table-view{width:100%;max-width:600px;border-collapse:collapse;font-family:monospace;font-size:11.5px}
.table-view th{text-align:left;padding:5px 8px;background:var(--panel3);color:var(--mu);font-weight:700;border-bottom:1px solid var(--bd);font-size:10px;text-transform:uppercase}
.table-view td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx);transition:background .3s}
.table-view tr.h td{background:rgba(227,179,65,.25)}
.text-view{font-family:monospace;font-size:12px;color:var(--tx);white-space:pre;line-height:1.6;background:var(--panel2);padding:14px 18px;border-radius:8px;border:1px solid var(--bd);max-width:100%;overflow:auto;transition:all .3s}
.text-view.h{border-color:var(--ye);box-shadow:0 0 12px rgba(227,179,65,.2)}
.skiplist{display:flex;flex-direction:column;gap:8px;align-items:center}
.sl-level{display:flex;gap:5px;align-items:center}
.sl-node{min-width:42px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--bd);border-radius:5px;font-family:monospace;font-size:11px;font-weight:700;transition:all .3s}
.sl-node.h{background:rgba(227,179,65,.35);border-color:var(--ye)}
.sl-node.null{color:var(--mu);font-weight:400}
.seg-view{display:flex;flex-direction:column;align-items:center;gap:12px}
.tree-svg,.graph-svg{display:block}
.ptr{font-size:11px;font-weight:700;font-family:monospace}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#404650}
.pill{display:inline-block;padding:2px 8px;background:var(--panel3);border-radius:10px;font-size:10px;font-family:monospace;margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Animated Simulator</h1>
    <div class="sub" id="count">0 data structures</div>
    <div id="nav"></div>
  </aside>
  <main>
    <div class="header">
      <h2 id="title">Select a data structure</h2>
      <div class="desc" id="desc"></div>
      <div class="cx" id="cx"></div>
    </div>
    <div class="viz-wrap"><div class="viz" id="viz"></div></div>
    <div class="ops" id="ops"></div>
    <div class="msg" id="msg">Click any operation button to see the animation.</div>
  </main>
</div>

<script>
"use strict";

/* ===== HELPERS ===== */
function $(id){return document.getElementById(id);}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;}
var SVGNS="http://www.w3.org/2000/svg";
function svgEl(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function nums(s){return String(s).split(",").map(function(x){return Number(x.trim());}).filter(function(x){return !isNaN(x);});}

/* ===== STATE ===== */
var STATE={ key:null, ds:null, busy:false };
var VIZ = $("viz");
var MSG = $("msg");
var SPEED = 550; // base delay ms

function setMsg(text, step){
  var h = "";
  if (step !== undefined) h += '<span class="step">[' + step + ']</span>';
  h += text;
  MSG.innerHTML = h;
}

/* ===== RENDERERS ===== */
var R = {};
var _lastRendered = null;

function clearViz(){ VIZ.innerHTML = ""; }

R.array = function(s){
  var w = el("div","cw");
  var row = el("div","cells");
  (s.data||[]).forEach(function(v,i){
    var cls = "cell";
    if ((s.h||[]).indexOf(i) >= 0) cls += " h";
    if ((s.g||[]).indexOf(i) >= 0) cls += " g";
    if ((s.r||[]).indexOf(i) >= 0) cls += " r";
    if ((s.p||[]).indexOf(i) >= 0) cls += " p";
    if ((s.dim||[]).indexOf(i) >= 0) cls += " dim";
    if (s.anim && s.anim[i]) cls += " " + s.anim[i];
    var c = el("div", cls, String(v) + '<span class="ix">' + i + '</span>');
    row.appendChild(c);
  });
  if (!(s.data||[]).length) row.innerHTML = '<div style="color:var(--mu);font-style:italic">(empty)</div>';
  w.appendChild(row);
  if (s.extra) w.appendChild(el("div","",'<div style="text-align:center;font-size:11px;color:var(--mu);font-family:monospace;margin-top:6px">'+s.extra+'</div>'));
  clearViz(); VIZ.appendChild(w);
};

R.bars = function(s){
  var w = el("div","bars");
  var data = s.data||[];
  var max = Math.max.apply(null, data.concat([1]));
  data.forEach(function(v,i){
    var b = el("div","bar");
    b.style.height = Math.max(22,(v/max)*180)+"px";
    if ((s.h||[]).indexOf(i)>=0) b.classList.add("h");
    if ((s.g||[]).indexOf(i)>=0) b.classList.add("g");
    if ((s.r||[]).indexOf(i)>=0) b.classList.add("r");
    if ((s.p||[]).indexOf(i)>=0) b.classList.add("p");
    b.innerHTML = "<span>"+v+"</span><span class=\"ix\">"+i+"</span>";
    w.appendChild(b);
  });
  clearViz(); VIZ.appendChild(w);
};

R.matrix = function(s){
  var w = el("div","grid");
  var cols = s.data[0] ? s.data[0].length : 1;
  w.style.gridTemplateColumns = "repeat("+cols+",minmax("+(s.cw||34)+"px,auto))";
  s.data.forEach(function(row,r){
    row.forEach(function(v,cc){
      var c = el("div","gc", String(v==="" ? " " : v));
      if (s.hdR!==undefined && r < s.hdR) c.classList.add("hd");
      if (s.hdC!==undefined && cc < s.hdC) c.classList.add("hd");
      var k = r+","+cc;
      if (s.h && s.h[k]) c.classList.add(s.h[k]);
      w.appendChild(c);
    });
  });
  clearViz();
  var wrap = el("div","cw");
  wrap.appendChild(w);
  VIZ.appendChild(wrap);
};

R.list = function(s){
  var w = el("div","ll-view");
  var nodes = s.nodes||[];
  if (!nodes.length) w.innerHTML = '<div style="color:var(--mu);font-style:italic">(empty)</div>';
  else nodes.forEach(function(v,i){
    var cls = "ll-box";
    if ((s.h||[]).indexOf(i)>=0) cls += " h";
    if ((s.g||[]).indexOf(i)>=0) cls += " g";
    if ((s.newI||[]).indexOf(i)>=0) cls += " new";
    if ((s.rmI||[]).indexOf(i)>=0) cls += " rm";
    var b = el("div", cls, String(v));
    var labels = {};
    if (i===s.cur) labels.cur="curr";
    if (i===s.prv) labels.prv="prev";
    if (i===s.nxt) labels.nxt="next";
    if (i===s.slow) labels.slow="slow";
    if (i===s.fast) labels.fast="fast";
    if (i===s.head) labels.head="head";
    if (i===s.tail) labels.tail="tail";
    var keys = Object.keys(labels);
    if (keys.length) b.appendChild(el("div","lbl", keys.map(function(k){return labels[k];}).join("/")));
    w.appendChild(b);
    if (i < nodes.length-1) w.appendChild(el("div","ll-arrow","→"));
  });
  clearViz();
  var wrap = el("div","cw");
  wrap.appendChild(w);
  if (s.extra) wrap.appendChild(el("div","",'<div style="text-align:center;font-size:11px;color:var(--mu);font-family:monospace;margin-top:6px">'+s.extra+'</div>'));
  VIZ.appendChild(wrap);
};

R.stack = function(s){
  var outer = el("div","cw");
  var w = el("div","stack-view");
  var items = s.items||[];
  if (!items.length) w.innerHTML = '<div style="color:var(--mu);font-style:italic">(empty)</div>';
  else items.slice().reverse().forEach(function(v,i){
    var real = items.length-1-i;
    var cls = "sbox";
    if (i===0) cls += " top";
    if ((s.h||[]).indexOf(real)>=0) cls += " h";
    if ((s.newI||[]).indexOf(real)>=0) cls += " new";
    if ((s.rmI||[]).indexOf(real)>=0) cls += " rm";
    w.appendChild(el("div", cls, String(v)));
  });
  outer.appendChild(w);
  outer.appendChild(el("div","sbase"));
  if (items.length) outer.appendChild(el("div","",'<div style="color:var(--gr);font-size:10px;font-weight:700;margin-top:4px">↑ TOP</div>'));
  if (s.extra) outer.appendChild(el("div","",'<div style="text-align:center;font-size:11px;color:var(--mu);font-family:monospace;margin-top:6px">'+s.extra+'</div>'));
  clearViz(); VIZ.appendChild(outer);
};

R.queue = function(s){
  var outer = el("div","cw");
  var w = el("div","queue-view");
  var items = s.items||[];
  if (!items.length) w.innerHTML = '<div style="color:var(--mu);font-style:italic">(empty)</div>';
  else items.forEach(function(v,i){
    var cls = "qbox";
    if (i===0) cls += " front";
    if (i===items.length-1 && items.length>1) cls += " back";
    if ((s.h||[]).indexOf(i)>=0) cls += " h";
    if ((s.newI||[]).indexOf(i)>=0) cls += " new";
    if ((s.rmI||[]).indexOf(i)>=0) cls += " rm";
    w.appendChild(el("div", cls, String(v)));
  });
  outer.appendChild(w);
  if (items.length){
    var lab = el("div");
    lab.style.cssText = "display:flex;justify-content:space-between;width:100%;padding:0 10px;font-size:10px;margin-top:4px";
    lab.innerHTML = '<span style="color:var(--gr)">↑ FRONT</span><span style="color:var(--wa)">BACK ↑</span>';
    outer.appendChild(lab);
  }
  if (s.extra) outer.appendChild(el("div","",'<div style="text-align:center;font-size:11px;color:var(--mu);font-family:monospace;margin-top:6px">'+s.extra+'</div>'));
  clearViz(); VIZ.appendChild(outer);
};

R.hash = function(s){
  var w = el("div","hash-view");
  (s.buckets||[]).forEach(function(chain,i){
    var row = el("div","hrow");
    var bcls = "hbucket";
    if (i === s.hb) bcls += " h";
    row.appendChild(el("div", bcls, String(i)));
    row.appendChild(el("div","harrow", chain.length ? "→" : "∅"));
    var cw = el("div","hchain");
    chain.forEach(function(e){
      var cls = "hentry";
      if (s.hk === e.k && i === s.hb) cls += " h";
      if (e._new) cls += " new";
      cw.appendChild(el("div", cls, e.k + ":" + e.v));
    });
    row.appendChild(cw);

/* ===== SVG: TREES ===== */
function treeLayout(root,W,H){
  var pos = new Map(); var idx = 0; var depths = [];
  function walk(n,d){
    if(!n) return;
    walk(n.left, d+1);
    pos.set(n,{x:idx++,d:d}); depths.push(d);
    walk(n.right, d+1);
  }
  walk(root,0);
  var n = idx || 1;
  var maxD = Math.max.apply(null, depths.concat([0]));
  var xGap = W/(n+1), yGap = H/(maxD+2);
  var final = new Map();
  pos.forEach(function(p,node){ final.set(node, {x:xGap*(p.x+1), y:yGap*(p.d+1)+15}); });
  return final;
}

  var sg = svgEl("svg",{viewBox:"0 0 "+W+" "+H, width:"100%"});

/* ===== SVG: TRIE ===== */
R.trie = function(s){
  if (!s.root){ clearViz(); VIZ.innerHTML = '<div style="color:var(--mu)">(empty)</div>'; return; }
  var W=760,H=240;
  var sg = svgEl("svg",{viewBox:"0 0 "+W+" "+H, width:"100%"});
  sg.style.maxHeight = H+"px";
  function leaves(n){
    if (!n.children || !n.children.size) return 1;
    var s = 0;
    n.children.forEach(function(ch){ s += leaves(ch); });
    return s;
  }
  var total = Math.max(1, leaves(s.root));
  var xGap = W/(total+1), yGap = 40;
  var cursor = 1; var pos = new Map();
  function walk(n,d){
    if (!n.children || !n.children.size){ pos.set(n,{x:xGap*cursor++,y:40+d*yGap}); return; }
    var xs = [];
    n.children.forEach(function(ch){ walk(ch,d+1); xs.push(pos.get(ch).x); });
    var sum = xs.reduce(function(a,b){return a+b;},0);
    pos.set(n,{x:sum/xs.length,y:40+d*yGap});
  }
  walk(s.root,0);
  pos.forEach(function(p,n){
    if(!n.children) return;
    n.children.forEach(function(ch){
      var cp = pos.get(ch);
      sg.appendChild(svgEl("line",{x1:p.x,y1:p.y,x2:cp.x,y2:cp.y,stroke:"#30363d","stroke-width":1.5}));
    });
  });
  pos.forEach(function(p,n){
    var isH = n._id === s.hl, isRoot = n === s.root;
    sg.appendChild(svgEl("circle",{cx:p.x,cy:p.y,r:isRoot?12:14,fill:isH?"#e3b341":(n.end?"#7ee787":"#21262d"),stroke:isH?"#e3b341":"#30363d","stroke-width":2}));
    var t = svgEl("text",{x:p.x,y:p.y+4,"text-anchor":"middle","font-size":11,"font-weight":700,fill:(isH||n.end)?"#0d1117":"#c9d1d9"});
    t.textContent = isRoot ? "⌂" : n.ch;
    sg.appendChild(t);
  });
  clearViz(); VIZ.appendChild(sg);
};

R.seg = function(s){

    var d = Math.floor(Math.log2(i));

R.quad = function(s){
  var W=380,H=260;
  var sg = svgEl("svg",{viewBox:"0 0 "+W+" "+H, width:"100%"});
  sg.style.maxHeight = H+"px";
  function draw(node,x,y,w,h,depth){
    if (!node) return;
    var isLeaf = !node.children || !node.children.length;
    var colors = ["#58a6ff","#7ee787","#e3b341","#bc8cff"];
    var col = colors[depth % colors.length];
    if (isLeaf){
      sg.appendChild(svgEl("rect",{x:x,y:y,width:w,height:h,fill:node.val?"rgba(126,231,135,.2)":"rgba(48,54,61,.4)",stroke:col,"stroke-width":1.5}));
      if (node.val !== undefined){
        var t = svgEl("text",{x:x+w/2,y:y+h/2+4,"text-anchor":"middle","font-size":11,fill:"#c9d1d9"});
        t.textContent = node.val;
        sg.appendChild(t);
      }
    } else {
      sg.appendChild(svgEl("rect",{x:x,y:y,width:w,height:h,fill:"none",stroke:col,"stroke-width":1,"stroke-dasharray":"3 3"}));
      var hw = w/2, hh = h/2;
      draw(node.children[0], x, y, hw, hh, depth+1);
      draw(node.children[1], x+hw, y, hw, hh, depth+1);
      draw(node.children[2], x, y+hh, hw, hh, depth+1);
      draw(node.children[3], x+hw, y+hh, hw, hh, depth+1);
    }
  }
  draw(s.root, 20, 20, W-40, H-40, 0);
  clearViz(); VIZ.appendChild(sg);
};

/* ===== SIMULATION HELPERS ===== */
function setView(spec, msg, stepLabel){
  if (spec && spec.type && R[spec.type]) R[spec.type](spec);
  if (msg) setMsg(msg, stepLabel);
}

async function runFrames(frames){
  if (STATE.busy) return;
  STATE.busy = true;
  var btns = document.querySelectorAll(".ops button");
  btns.forEach(function(b){ b.disabled = true; });
  try {
    for (var i = 0; i < frames.length; i++){
      var f = frames[i];
      setView(f.spec, f.msg, f.step !== undefined ? f.step : (i+1) + "/" + frames.length);
      await sleep(f.delay || SPEED);
    }
    setMsg("Animation complete.");
  } finally {
    STATE.busy = false;
    btns.forEach(function(b){ b.disabled = false; });
  }
}

}

def("Arrays","sorted-array","Sorted Array",
  "Ascending order enables binary search O(log n).",
  [["Search","O(log n)"],["Insert","O(n)"]],
  function(){ return { data: [2,5,8,12,16,23,38,56,72,91] }; },
  {
    "Binary search 23": function(){
      var arr = [2,5,8,12,16,23,38,56,72,91], t=23;
      var frames = [{spec:{type:"array",data:arr,extra:"Searching for 23"}, msg:"Start binary search for 23", step:"0/?", delay:600}];
      var lo=0, hi=arr.length-1, s=1;
      while (lo<=hi){
        var mid = (lo+hi)>>1;
        frames.push({
          spec:{type:"array",data:arr,h:[mid],p:[],extra:"lo="+lo+"  hi="+hi+"  mid="+mid+"  a[mid]="+arr[mid]},
          msg:"lo="+lo+", hi="+hi+", mid="+mid+" → a[mid]="+arr[mid],
          step:"step "+s, delay:700
        });
        if (arr[mid]===t){ frames.push({spec:{type:"array",data:arr,g:[mid],extra:"Found!"}, msg:"<b>Found 23 at index "+mid+"</b>", step:"done", delay:900}); return frames; }
        if (arr[mid]<t){ lo = mid+1; frames.push({spec:{type:"array",data:arr,dim:Array.from({length:mid+1},function(_,k){return k;}),h:[mid],extra:"Drop left half"}, msg:"a[mid] < 23 → search right", step:"step "+(++s), delay:600}); }
        else { hi = mid-1; frames.push({spec:{type:"array",data:arr,dim:Array.from({length:arr.length-mid},function(_,k){return k+mid;}),h:[mid],extra:"Drop right half"}, msg:"a[mid] > 23 → search left", step:"step "+(++s), delay:600}); }
        s++;
      }
      frames.push({spec:{type:"array",data:arr,extra:"Not found"}, msg:"Not found", step:"done", delay:700});
      return frames;
    },
    "Linear scan": function(){
      var arr = [2,5,8,12,16,23,38,56,72,91];
      var frames = [];
      for (var i=0;i<arr.length;i++){
        frames.push({
          spec:{type:"array",data:arr,h:[i],extra:"Scanning index "+i+" → "+arr[i]},
          msg:"Compare a["+i+"]="+arr[i]+" with 23",
          step:(i+1)+"/"+arr.length, delay:400
        });
        if (arr[i]===23){
          frames.push({spec:{type:"array",data:arr,g:[i],extra:"Found!"}, msg:"<b>Found 23 at index "+i+"</b> (linear scan O(n))", step:"done", delay:900});
          return frames;
        }
      }
      return frames;
    }
  });

def("Strings","rle","Run-Length Encoded String",
  "Compress runs: 'aaabb' → 'a3b2'.",
  [["Encode","O(n)"],["Decode","O(n)"]],
  function(){ return {}; },
  {
    "Encode 'aaabbccccdaa'": function(){
      var s = "aaabbccccdaa";
      var frames = [{spec:{type:"array",data:s.split(""),cellClass:"sm",extra:"Original"}, msg:"Encode '"+s+"'", step:"0/?"}];
      var out = "", i=0;
      while (i<s.length){
        var j=i;
        while (j<s.length && s[j]===s[i]) j++;
        var run = j-i;
        out += s[i]+run;
        frames.push({
          spec:{type:"array",data:s.split(""),cellClass:"sm",h:Array.from({length:run},function(_,k){return i+k;}),extra:"Run of '"+s[i]+"' × "+run},
          msg:"Run '"+s[i]+"' × "+run+" → '"+s[i]+run+"'",
          step:(frames.length)+"/?", delay:600
        });
        i=j;
      }
      frames.push({spec:{type:"array",data:out.split(""),cellClass:"sm",g:Array.from({length:out.length},function(_,k){return k;}),extra:"Encoded"}, msg:"<b>Encoded: '"+out+"'</b>", step:"done", delay:900});
      return frames;
    }
  });

def("Strings","rolling-hash","Rolling Hash String",
  "Sliding-window hash (Rabin-Karp). O(1) per shift.",
  [["Shift","O(1)"]],
  function(){ return {}; },
  {
    "Compute k=3 hashes": function(){
      var s = "abcde", k = 3;
      var frames = [{spec:{type:"array",data:s.split(""),cellClass:"sm",extra:"Rolling hash on 'abcde' with window k=3"}, msg:"Initialize rolling hash k=3", step:"0/?"}];
      for (var i=0;i<=s.length-k;i++){
        var sub = s.slice(i, i+k);
        var h = 0;
        for (var j=0;j<k;j++) h = h*31 + sub.charCodeAt(j);
        frames.push({
          spec:{type:"array",data:s.split(""),cellClass:"sm",h:Array.from({length:k},function(_,x){return i+x;}),extra:"hash('"+sub+"') = "+h},
          msg:"Window '"+sub+"' → hash = "+h,
          step:(i+1)+"/"+(s.length-k+1), delay:700
        });
      }
      frames.push({spec:{type:"array",data:s.split(""),cellClass:"sm",g:[0,1,2,3,4],extra:"Rolling hash computed"}, msg:"Each hash computed in O(1) from the previous", step:"done", delay:900});
      return frames;

def("Strings","trie-string","Trie-Embedded String",
  "String stored as a path down a Trie. Shared prefixes save space.",
  [["Insert","O(L)"],["Search","O(L)"]],
  function(){ return {}; },
  {
    "Build 'cat','car','card','care'": function(){
      var words = ["cat","car","card","care"];
      var root = { ch:"", children: new Map(), end:false, _id:0 };
      var id = 1;
      var frames = [{spec:{type:"trie",root:JSON.parse(JSON.stringify({ch:"",children:{},end:false,_id:0}))}, msg:"Start empty trie", step:"0/?"}];
      function snap(){ return {ch:root.ch, children:new Map(), end:root.end, _id:root._id, _map:true,
        // rebuild children as Map for the renderer
      }; }
      function cloneNode(n){
        var c = { ch: n.ch, children: new Map(), end: n.end, _id: n._id };
        n.children.forEach(function(v,k){ c.children.set(k, cloneNode(v)); });
        return c;
      }
      function cloneRoot(){
        // wrap root in a form compatible with renderer
        function c(n){
          var node = { ch: n.ch, children: new Map(), end: n.end, _id: n._id };
          n.children.forEach(function(v,k){ node.children.set(k, c(v)); });
          return node;
        }
        return c(root);
      }
      frames[0].spec.root = cloneRoot();
      words.forEach(function(w){
        var cur = root;
        for (var i=0;i<w.length;i++){
          var ch = w[i];
          if (!cur.children.has(ch)){
            cur.children.set(ch, {ch:ch, children:new Map(), end:false, _id:id++});
            frames.push({
              spec:{type:"trie",root:cloneRoot(),hl:cur.children.get(ch)._id},
              msg:"Create node '"+ch+"' for '"+w+"'",
              step:"insert "+w, delay:500
            });
          } else {
            frames.push({
              spec:{type:"trie",root:cloneRoot(),hl:cur.children.get(ch)._id},
              msg:"Reuse existing '"+ch+"' for '"+w+"'",
              step:"insert "+w, delay:500
            });
          }
          cur = cur.children.get(ch);
        }
        cur.end = true;
        frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur._id}, msg:"Mark end of '"+w+"'", step:"insert "+w, delay:600});
      });
      frames.push({spec:{type:"trie",root:cloneRoot()}, msg:"Trie built — 4 words share prefixes 'ca' and 'car'", step:"done", delay:900});
      return frames;
    }
  });

/* ===== BINARY TREES ===== */
function mkTree(vals){var root=null;function ins(n,v){if(!n)return{v:v,left:null,right:null};if(v<n.v)n.left=ins(n.left,v);else if(v>n.v)n.right=ins(n.right,v);return n;}vals.forEach(function(v){root=ins(root,v);});return root;}
function cloneTree(n){return n?{v:n.v,left:cloneTree(n.left),right:cloneTree(n.right)}:null;}
function treeMaxDepth(n){if(!n)return 0;return 1+Math.max(treeMaxDepth(n.left),treeMaxDepth(n.right));}

def("Binary Trees","binary-tree","Binary Tree",
  "Each node has ≤ 2 children.",
  [["Traverse","O(n)"]],
  function(){ return {}; },
  {
    "Show tree": function(){
      var root = mkTree([4,2,6,1,3,5,7]);
      return [{spec:{type:"tree",root:cloneTree(root),maxD:treeMaxDepth(root)}, msg:"Balanced binary tree with 7 nodes", step:"1/1"}];
    },
    "Inorder traversal": function(){
      var root = mkTree([4,2,6,1,3,5,7]);
      var out = [];
      var frames = [];
      function walk(n){
        if (!n) return;
        walk(n.left);
        out.push(n.v);
        frames.push({spec:{type:"tree",root:cloneTree(root),g:n,maxD:treeMaxDepth(root),extra:"out = ["+out.join(",")+"]"}, msg:"Visit "+n.v, step:frames.length+"/7", delay:500});
        walk(n.right);
      }
      walk(root);
      frames.push({spec:{type:"tree",root:cloneTree(root),maxD:treeMaxDepth(root),extra:"inorder = ["+out.join(",")+"]"}, msg:"Inorder: ["+out.join(",")+"]", step:"done", delay:600});
      return frames;
    }
  });

def("Binary Trees","bst","Binary Search Tree (BST)",
  "Left < node < right. Inorder traversal yields sorted order.",
  [["Search","O(log n)*"],["Insert","O(log n)*"]],
  function(){ return { root: mkTree([50,30,70,20,40,60,80]) }; },
  {
    "Search 40": function(){
      var root = mkTree([50,30,70,20,40,60,80]);
      var frames = [{spec:{type:"tree",root:cloneTree(root),maxD:treeMaxDepth(root)}, msg:"Search for 40", step:"1/?"}];
      var cur = root, k = 1;
      while (cur){
        frames.push({spec:{type:"tree",root:cloneTree(root),hl:cur,maxD:treeMaxDepth(root)}, msg:"Compare 40 with "+cur.v, step:"step "+k, delay:600});
        if (cur.v === 40){
          frames.push({spec:{type:"tree",root:cloneTree(root),g:cur,maxD:treeMaxDepth(root)}, msg:"<b>Found 40</b>", step:"done", delay:900});
          return frames;
        }
        cur = 40 < cur.v ? cur.left : cur.right;
        k++;
      }
      return frames;
    },
    "Insert 65": function(){
      var root = mkTree([50,30,70,20,40,60,80]);
      var frames = [{spec:{type:"tree",root:cloneTree(root),maxD:treeMaxDepth(root)}, msg:"Insert 65", step:"1/?"}];
      var cur = root, k = 1;
      while (true){
        frames.push({spec:{type:"tree",root:cloneTree(root),hl:cur,maxD:treeMaxDepth(root)}, msg:"Compare 65 with "+cur.v, step:"step "+k, delay:600});
        if (65 < cur.v){
          if (!cur.left) break;
          cur = cur.left;
        } else if (65 > cur.v){
          if (!cur.right) break;
          cur = cur.right;
        } else break;
        k++;
      }
      if (65 < cur.v) cur.left = {v:65,left:null,right:null};
      else cur.right = {v:65,left:null,right:null};
      frames.push({spec:{type:"tree",root:cloneTree(root),g:cur.left||cur.right,maxD:treeMaxDepth(root),extra:"Inserted 65"}, msg:"Inserted 65", step:"done", delay:900});
      return frames;
    }
  });

def("Advanced Trees","segment-tree","Segment Tree",
  "Range query in O(log n). Point update O(log n).",
  [["Build","O(n)"],["Query","O(log n)"],["Update","O(log n)"]],
  function(){ return {}; },
  {
    "Build & query [1..4]": function(){
      var arr = [2,5,1,4,9,3];
      var tree = new Array(4*arr.length).fill(undefined);
      var frames = [];
      function build(node,l,r){
        if (l===r){ tree[node]=arr[l]; frames.push({spec:{type:"seg",arr:arr,tree:tree.slice(),hl:node}, msg:"Leaf ["+l+","+l+"] = "+arr[l], step:"build", delay:400}); return; }
        var m=(l+r)>>1;
        build(2*node,l,m); build(2*node+1,m+1,r);
        tree[node]=tree[2*node]+tree[2*node+1];
        frames.push({spec:{type:"seg",arr:arr,tree:tree.slice(),hl:node}, msg:"Node "+node+": sum["+l+".."+r+"] = "+tree[node], step:"build", delay:400});
      }
      build(1,0,arr.length-1);
      frames.push({spec:{type:"seg",arr:arr,tree:tree.slice(),range:[1,4]}, msg:"Query range [1..4]", step:"query", delay:600});
      var sum = 0;
      function query(node,l,r,ql,qr){
        if (qr<l || r<ql) return 0;
        if (ql<=l && r<=qr){
          sum += tree[node];
          frames.push({spec:{type:"seg",arr:arr,tree:tree.slice(),hl:node,range:[l,r]}, msg:"Add node "+node+" ("+tree[node]+") → total "+sum, step:"query", delay:500});
          return tree[node];
        }
        var m=(l+r)>>1;
        return query(2*node,l,m,ql,qr)+query(2*node+1,m+1,r,ql,qr);
      }
      query(1,0,arr.length-1,1,4);
      frames.push({spec:{type:"seg",arr:arr,tree:tree.slice(),range:[1,4],extra:"Range sum = "+sum}, msg:"Range sum [1..4] = <b>"+sum+"</b>", step:"done", delay:900});
      return frames;
    }
  });

def("Tries","trie","Trie / Prefix Tree",
  "Character tree. O(L) insert/search; shares prefixes.",
  [["Insert","O(L)"],["Search","O(L)"]],
  function(){ return {}; },
  {
    "Build & search 'card'": function(){
      var words = ["cat","car","card","dog","do"];
      var root = { ch:"", children: new Map(), end:false, _id:0 };
      var id = 1;
      function cloneRoot(){
        function c(n){
          var node = { ch: n.ch, children: new Map(), end: n.end, _id: n._id };
          n.children.forEach(function(v,k){ node.children.set(k, c(v)); });
          return node;
        }
        return c(root);
      }
      var frames = [{spec:{type:"trie",root:cloneRoot()}, msg:"Start empty trie", step:"0/?"}];
      words.forEach(function(w){
        var cur = root;
        for (var i=0;i<w.length;i++){
          var ch = w[i];
          if (!cur.children.has(ch)){
            cur.children.set(ch, {ch:ch, children:new Map(), end:false, _id:id++});
            frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur.children.get(ch)._id}, msg:"Create '"+ch+"' for '"+w+"'", step:"insert "+w, delay:400});
          } else {
            frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur.children.get(ch)._id}, msg:"Reuse '"+ch+"'", step:"insert "+w, delay:400});
          }
          cur = cur.children.get(ch);
        }
        cur.end = true;
        frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur._id}, msg:"Mark end of '"+w+"'", step:"insert "+w, delay:500});
      });
      var target = "card", cur = root;
      frames.push({spec:{type:"trie",root:cloneRoot()}, msg:"Now search 'card'", step:"search", delay:500});
      for (var i=0;i<target.length;i++){
        if (!cur.children.has(target[i])) break;
        cur = cur.children.get(target[i]);
        frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur._id}, msg:"Descend to '"+target[i]+"'", step:"search", delay:500});
      }
      frames.push({spec:{type:"trie",root:cloneRoot(),hl:cur._id}, msg:"<b>Found 'card'</b> (end="+cur.end+")", step:"done", delay:900});
      return frames;
    }
  });

var GNODES = {A:{x:120,y:60},B:{x:320,y:60},C:{x:520,y:60},D:{x:120,y:200},E:{x:320,y:200},F:{x:520,y:200},G:{x:720,y:130}};
var GEDGES = [["A","B"],["A","D"],["B","C"],["B","E"],["C","F"],["C","G"],["D","E"],["E","F"],["F","G"]];

def("Graphs","undirected","Undirected Graph",
  "Edges have no direction. A—B implies B—A.",
  [["Traverse","O(V+E)"]],
  function(){ return {}; },
  {
    "BFS from A": function(){
      var adj = {};
      Object.keys(GNODES).forEach(function(n){ adj[n]=[]; });
      GEDGES.forEach(function(e){ adj[e[0]].push(e[1]); adj[e[1]].push(e[0]); });
      var visited = new Set(["A"]);
      var queue = ["A"];
      var order = [];
      var frames = [{spec:{type:"graph",nodes:GNODES,edges:GEDGES,current:"A"}, msg:"Start BFS from A", step:"0/?"}];
      while (queue.length){
        var u = queue.shift();
        order.push(u);
        frames.push({spec:{type:"graph",nodes:GNODES,edges:GEDGES,visited:Array.from(visited),current:u,extra:"order=["+order.join(",")+"]  queue=["+queue.join(",")+"]"}, msg:"Dequeue "+u, step:frames.length+"/?", delay:600});
        adj[u].forEach(function(v){
          if (!visited.has(v)){
            visited.add(v);
            queue.push(v);
            frames.push({spec:{type:"graph",nodes:GNODES,edges:GEDGES,visited:Array.from(visited),current:v,extra:"queue=["+queue.join(",")+"]"}, msg:"Enqueue "+v, step:frames.length+"/?", delay:500});
          }
        });
      }
      frames.push({spec:{type:"graph",nodes:GNODES,edges:GEDGES,visited:Array.from(visited),extra:"order = "+order.join(" → ")}, msg:"BFS order: <b>"+order.join(" → ")+"</b>", step:"done", delay:900});
      return frames;
    }
  });

def("Graphs","dag","Directed Acyclic Graph (DAG)",
  "Digraph with no cycles. Topological order exists.",
  [["Topo sort","O(V+E)"]],
  function(){ return {}; },
  {
    "Kahn's topo sort": function(){
      var nodes = {A:{x:80,y:120},B:{x:220,y:60},C:{x:220,y:180},D:{x:360,y:60},E:{x:360,y:180},F:{x:500,y:120}};
      var edges = [["A","B"],["A","C"],["B","D"],["C","E"],["D","F"],["E","F"]];
      var adj = {}, indeg = {};
      Object.keys(nodes).forEach(function(n){ adj[n]=[]; indeg[n]=0; });
      edges.forEach(function(e){ adj[e[0]].push(e[1]); indeg[e[1]]++; });
      var queue = Object.keys(nodes).filter(function(n){ return indeg[n]===0; });
      var order = [];
      var frames = [{spec:{type:"graph",nodes:nodes,edges:edges,directed:true,dist:indeg}, msg:"Start Kahn's — queue = ["+queue.join(",")+"]", step:"0/?"}];
      while (queue.length){
        var u = queue.shift();
        order.push(u);
        frames.push({spec:{type:"graph",nodes:nodes,edges:edges,directed:true,visited:order.slice(),current:u,dist:indeg}, msg:"Dequeue "+u+" → order ["+order.join(",")+"]", step:frames.length+"/?", delay:600});
        adj[u].forEach(function(v){
          indeg[v]--;
          frames.push({spec:{type:"graph",nodes:nodes,edges:edges,directed:true,visited:order.slice(),current:v,dist:indeg}, msg:"indeg["+v+"] → "+indeg[v], step:frames.length+"/?", delay:400});
          if (indeg[v]===0) queue.push(v);
        });
      }
      frames.push({spec:{type:"graph",nodes:nodes,edges:edges,directed:true,visited:order.slice()}, msg:"Topological order: <b>"+order.join(" → ")+"</b>", step:"done", delay:900});
      return frames;
    }
  });

def("Graphs","weighted","Weighted Graph",
  "Edges carry weights (distance/cost/time).",
  [["Dijkstra","O((V+E)logV)"]],
  function(){ return {}; },
  {
    "Dijkstra from A": function(){
      var nodes = {A:{x:100,y:160},B:{x:300,y:60},C:{x:500,y:60},D:{x:300,y:260},E:{x:500,y:260},F:{x:700,y:160}};
      var edges = [["A","B",4],["A","D",2],["B","C",5],["B","D",1],["C","F",3],["D","E",3],["E","F",4],["B","E",7]];
      var adj = {};
      Object.keys(nodes).forEach(function(n){ adj[n]=[]; });
      edges.forEach(function(e){ adj[e[0]].push([e[1],e[2]]); adj[e[1]].push([e[0],e[2]]); });
      var dist = {};
      Object.keys(nodes).forEach(function(n){ dist[n] = Infinity; });
      dist["A"] = 0;
      var visited = new Set();
      var frames = [{spec:{type:"graph",nodes:nodes,edges:edges,dist:Object.assign({},dist),current:"A"}, msg:"Init dist[A]=0", step:"0/?"}];
      while (visited.size < Object.keys(nodes).length){
        var u = null, best = Infinity;
        Object.keys(nodes).forEach(function(n){ if (!visited.has(n) && dist[n] < best){ best = dist[n]; u = n; } });
        if (u === null) break;
        visited.add(u);
        frames.push({spec:{type:"graph",nodes:nodes,edges:edges,visited:Array.from(visited),current:u,dist:Object.assign({},dist)}, msg:"Extract min: "+u+" (dist="+best+")", step:frames.length+"/?", delay:700});
        adj[u].forEach(function(pair){
          var v = pair[0], w = pair[1];
          if (visited.has(v)) return;
          var nd = dist[u] + w;
          if (nd < dist[v]){
            dist[v] = nd;
            frames.push({spec:{type:"graph",nodes:nodes,edges:edges,visited:Array.from(visited),current:v,dist:Object.assign({},dist)}, msg:"Relax "+u+"→"+v+": "+dist[u]+"+"+w+"="+nd, step:frames.length+"/?", delay:600});
          }
        });
      }
      frames.push({spec:{type:"graph",nodes:nodes,edges:edges,visited:Array.from(visited),dist:dist}, msg:"Shortest distances computed", step:"done", delay:900});
      return frames;
    }
  });

/* ===== UI ===== */
var nav = $("nav");
var currentKey = null;

var catGroup = {};
ORDER.forEach(function(cat){ catGroup[cat] = []; });
Object.keys(LIB).forEach(function(key){
  var ds = LIB[key];
  if (!catGroup[ds.cat]) catGroup[ds.cat] = [];
  catGroup[ds.cat].push({ key: key, title: ds.title });
});

var firstKey = null;
var total = 0;
ORDER.forEach(function(cat){
  var list = catGroup[cat];
  if (!list || !list.length) return;
  var catEl = el("div","cat", cat);
  var itemEls = [];
  list.forEach(function(item){
    var itemEl = el("div","item", item.title);
    itemEl.dataset.key = item.key;
    itemEl.onclick = function(){ selectDS(item.key); };
    itemEls.push(itemEl);
    if (!firstKey) firstKey = item.key;
    total++;
  });
  catEl.onclick = function(){
    catEl.classList.toggle("c");
    var collapsed = catEl.classList.contains("c");
    itemEls.forEach(function(el){
      el.style.display = collapsed ? "none" : "";
    });
  };
  nav.appendChild(catEl);
  itemEls.forEach(function(el){ nav.appendChild(el); });
});
$("count").textContent = total + " data structures";

function selectDS(key){
  if (STATE.busy) return;
  var ds = LIB[key];
  if (!ds) return;
  STATE.key = key;
  STATE.ds = ds;
  document.querySelectorAll(".item").forEach(function(e){
    e.classList.toggle("a", e.dataset.key === key);
  });
  $("title").textContent = ds.title;
  $("desc").textContent = ds.desc;
  $("cx").innerHTML = (ds.cx||[]).map(function(c){
    var cls = /O\(1\)|log|α|amort/.test(c[1]) ? "t" : "s";
    return '<span class="cxb '+cls+'">'+c[0]+' · '+c[1]+'</span>';
  }).join("");
  // Show a default "overview" frame
  VIZ.innerHTML = "";
  try {
    var opNames = Object.keys(ds.ops||{});
    if (opNames.length){
      var firstOp = ds.ops[opNames[0]];
      var initialFrames = firstOp.call(ds.init ? ds.init() : {});
      if (initialFrames && initialFrames.length && initialFrames[0].spec){
        setView(initialFrames[0].spec, "Ready — click any operation below to start the animation.");
      } else {
        setMsg("Ready — click any operation below to start the animation.");
      }
    } else {
      setMsg("No interactive operations.");
    }
  } catch(e){
    console.error(e);
    setMsg("Ready — click any operation below to start the animation.");
  }
  // Build op buttons
  var opsEl = $("ops");
  opsEl.innerHTML = "";
  var opNames = Object.keys(ds.ops||{});
  if (!opNames.length){
    opsEl.innerHTML = '<span style="color:var(--mu);font-size:11px">(no operations)</span>';
  } else {
    opNames.forEach(function(name){
      var btn = document.createElement("button");
      btn.textContent = name;
      btn.className = "primary";
      btn.onclick = async function(){
        if (STATE.busy) return;
        var frames = ds.ops[name]();
        if (!frames || !frames.length){ setMsg("(no frames)"); return; }
        await runFrames(frames);
      };
      opsEl.appendChild(btn);
    });
  }
}

if (firstKey) selectDS(firstKey);
</script>
</body>
</html>
